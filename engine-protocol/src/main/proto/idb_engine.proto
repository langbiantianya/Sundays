syntax = "proto3";

option java_package = "com.langbiantianya.grpc";
option java_multiple_files = true;

import "google/protobuf/struct.proto";

// ============================================================================
// Enums
// ============================================================================

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  SCHEMA       = 1;
  USER         = 2;
  TABLE        = 3;
  DATA         = 4;
  SQL          = 5;
  SYSTEM       = 6;
  FUNCTION     = 7;
  EXPORT       = 8;
  VIEW         = 9;
  INDEX        = 10;
  FOREIGN_KEY  = 11;
  TRIGGER      = 12;
  IMPORT       = 14;  // v2.16: 数据导入（CSV / JSON_LINES → 目标表）
  ANALYSIS     = 15;  // v2.29: 数据分析模式（列源元数据 + 在计算引擎上跑分析 SQL）
  REPORT       = 16;  // v2.29: 报表生成（ReportSpec → .xlsx）
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  LIST            = 1;
  CREATE          = 2;
  UPDATE          = 3;
  DELETE          = 4;
  EXECUTE         = 5;
  GET_DDL         = 6;
  INFO            = 7;
  GRANTS          = 8;
  GENERATE        = 9;
  DEBUG           = 10;
  CALL            = 11;
  RUN_EXPORT      = 12;  // proto3 enum global uniqueness — EXPORT conflicts with Category.EXPORT
  RENAME          = 13;
  TRUNCATE        = 14;
  EXPLAIN         = 15;  // defined but not routed in dispatcher
  TEST_CONNECTION = 16;
  SERVER_INFO     = 17;
  LIST_DRIVERS    = 18;  // v2.8: 列出引擎已加载的所有方言插件 + 连接元数据
  DISCONNECT      = 19;  // v2.15: 关闭某配置的 HikariCP 连接池（与 TEST_CONNECTION 对称的连接生命周期端点）
  CANCEL       = 20;  // v2.16: 取消正在执行的请求（Statement.cancel）
  RUN_IMPORT   = 21;  // v2.16: 启动一次数据导入任务
  BEGIN        = 22;  // v2.16: 开启事务会话（固定连接 + autocommit=false）
  COMMIT       = 23;  // v2.16: 提交事务会话
  ROLLBACK     = 24;  // v2.16: 回滚事务会话
  SESSION_INFO = 25;  // v2.16: 查询事务会话状态

  // ---- v2.29: 数据分析模式 ----
  // 这四个动作**只在 Category.ANALYSIS 下有意义**，与别的 Category 里的同名动作
  // （LIST / EXECUTE）刻意区分开：分析模式的请求带 read_only 标记、要打在
  // 特定的方言上，走同一套 (Category, Action) 表分不开。
  LIST_SOURCES = 26;  // 列该连接的「命名空间」（MySQL 的库 / PG 的 schema）
  LIST_TABLES  = 27;  // 列远端表（只读 SPI）
  LIST_COLUMNS = 28;  // 列远端列（只读 SPI）
  RUN_QUERY    = 29;  // 在**计算引擎**（本地嵌入式方言）上跑分析 SQL

  BUILD_EXCEL  = 30;  // v2.29: ReportSpec → .xlsx（Category.REPORT；M5 落地，本轮只落枚举）
  PULL_TABLE   = 31;  // v2.29: 远端表 → 本地工作区（DuckDB 联邦直查，零 CSV 中转）
}

// ============================================================================
// Shared types
// ============================================================================

message ConnectionConfig {
  string driver    = 1;
  string host      = 2;
  int32  port      = 3;
  string user      = 4;
  string password  = 5;
  string database  = 6;
  string schema    = 7;
  bool   use_ssl   = 8;
  map<string, string> properties = 9;

  // v2.11: 完整 JDBC URL（如 "jdbc:mysql://user@host:3306/db?useSSL=false"）。
  // 非空时 PoolManager 直接用它建立连接池，host/port/database 被忽略，
  // 方言由 URL scheme 反查（DialectLoader.getDialectByJdbcUrl）。
  string jdbc_url  = 10;

  // v2.29: 会话级只读标记（L4 闸门的判据）。
  //
  // 置 true 时，引擎在**进入 handler 之前**拒绝一切写路由，返回明确的只读错误。
  //
  // 为什么是**请求级**而不是连接级：只读是「这次调用属于哪种会话」的性质，
  // 不是「这条连接是什么」的性质。同一条远端连接，在分析模式里是只读的，
  // 在浏览模式里不是 —— 所以它不该被记在 connection.json 里。
  bool read_only   = 11;
}

// Column definition used by TABLE.CREATE and TABLE.UPDATE.
message ColumnDef {
  string name           = 1;
  string type           = 2;
  int32  size           = 3;   // 0 == unspecified
  optional bool nullable = 4;   // default true; `optional` gives presence semantics so mapper can omit default-true
  bool   is_primary_key = 5;
  string default_value  = 6;
  bool   auto_increment = 7;
  string new_name       = 8;   // used by MODIFY_COLUMN rename
}

// Lua造数脚本定义 (used by DATA.GENERATE).
message GenerateTable { string script = 1; }

// ============================================================================
// Per-Category REQUEST bodies
// ============================================================================

// ---------- SYSTEM ----------
// SYSTEM.CANCEL 用 target_request_id 指定被取消的请求；
// SYSTEM.SESSION_INFO 用 session_id 指定会话（留空则列出全部活跃会话）。
// INFO / TEST_CONNECTION / SERVER_INFO / LIST_DRIVERS / DISCONNECT / BEGIN / COMMIT / ROLLBACK 为 no-arg。
message SystemRequest {
  string target_request_id = 1;
  string session_id        = 2;
}

// ---------- SCHEMA ----------
message SchemaListRequest {
  string level    = 1;   // "database" (default) | "schema"
  string database = 2;   // required when level == "schema"
}
message SchemaCreateRequest {
  string name = 1;
  map<string, string> options = 2;  // MySQL charset/collate
  optional bool if_not_exists = 3; // CREATE SCHEMA/DATABASE IF NOT EXISTS <name>
}
message SchemaDeleteRequest { string name = 1; optional bool if_exists = 2; }
message SchemaRequest {
  oneof body {
    SchemaListRequest   list   = 1;
    SchemaCreateRequest create = 2;
    SchemaDeleteRequest delete = 3;
  }
}

// ---------- USER ----------
message UserListRequest {
  string user = 1;   // optional; when set, returns privileges instead of users
  string host = 2;   // default "%"
}
message UserCreateRequest {
  string user     = 1;
  string password = 2;
  string host     = 3;   // default "%"
}
message UserUpdateRequest {
  string user     = 1;
  // Path A: change password
  string password = 2;
  string host     = 3;   // default "%"
  // Path B: change privileges
  string schema               = 4;
  repeated string privileges  = 5;
  bool is_grant               = 6;
  string table_name           = 7;
  bool with_grant_option      = 8;
}
message UserDeleteRequest {
  string user = 1;
  string host = 2;   // default "%"
}
message UserGrantsRequest {
  string user = 1;
  string host = 2;   // default "%"
}
message UserRequest {
  oneof body {
    UserListRequest   list   = 1;
    UserCreateRequest create = 2;
    UserUpdateRequest update = 3;
    UserDeleteRequest delete = 4;
    UserGrantsRequest grants = 5;
  }
}

// ---------- TABLE ----------
message TableListRequest       { string schema = 1; }
message TableColumnListRequest {
  string table_name = 1;
  string schema     = 2;
}
message TableCreateRequest {
  string table_name = 1;
  repeated ColumnDef columns = 2;
  map<string, string> options = 3;
  string schema = 4;
  optional bool if_not_exists = 5;
}
message TableUpdateRequest {
  string table_name = 1;
  string operation = 2;        // ADD_COLUMN | DROP_COLUMN | MODIFY_COLUMN
  ColumnDef column = 3;        // for ADD_COLUMN / MODIFY_COLUMN
  string column_name = 4;      // for DROP_COLUMN
  string schema = 5;
}
message TableGetDdlRequest    { string table_name = 1; string schema = 2; }
message TableRenameRequest {
  string old_name   = 1;       // primary; accepts either old_name or table_name
  string table_name = 2;       // alias for old_name
  string new_name   = 3;
  string schema     = 4;
}
message TableDeleteRequest    { string table_name = 1; string schema = 2; optional bool if_exists = 3; }
message TableTruncateRequest  { string table_name = 1; string schema = 2; }
message TableRequest {
  oneof body {
    TableListRequest       list        = 1;
    TableColumnListRequest column_list = 2;
    TableCreateRequest     create      = 3;
    TableUpdateRequest     update      = 4;
    TableGetDdlRequest     get_ddl     = 5;
    TableRenameRequest     rename      = 6;
    TableDeleteRequest     delete      = 7;
    TableTruncateRequest   truncate    = 8;
  }
}

// ---------- DATA ----------
message DataListRequest {
  string table_name = 1;
  int32  page       = 2;          // default 1
  optional int32 page_size = 3;   // default 50; 0 == streaming sentinel; `optional` lets us preserve 0
  string where      = 4;
  string order_by   = 5;
  string schema     = 6;
}
message DataCreateRequest {
  string table_name = 1;
  map<string, string> values = 2;   // column name -> stringified value
  string schema = 3;
  // 这些列写 SQL NULL。`values` 装不下 null（「没这个键」与「这个键是 null」是两种
  // map 表达不了的不同状态），所以用独立的列名清单显式声明。
  repeated string null_columns = 4;
}
message DataUpdateRequest {
  string table_name = 1;
  map<string, string> changes = 2;
  map<string, string> where   = 3;
  string schema = 4;
  // 同 DataCreateRequest.null_columns。
  repeated string null_columns = 5;
}
message DataDeleteRequest {
  string table_name = 1;
  map<string, string> where = 2;
  string schema = 3;
}
message DataGenerateRequest {
  string schema      = 1;
  repeated GenerateTable tables = 2;
  string lua_version  = 3;
}
message DataRequest {
  oneof body {
    DataListRequest    list     = 1;
    DataCreateRequest  create   = 2;
    DataUpdateRequest  update   = 3;
    DataDeleteRequest  delete   = 4;
    DataGenerateRequest generate = 5;
  }
}

// ---------- SQL ----------
message SqlExecuteRequest {
  string sql    = 1;
  string schema = 2;
  // v2.16: 分号分隔的多语句脚本。false（默认）= 整段当一条语句执行（v2.15 及之前行为）。
  // true = 按语句边界顺序拆分逐条执行，结果逐条回填到 SqlExecuteResponse.statements。
  // 拆分器会跳过字符串字面量 / 注释 / PostgreSQL dollar-quoting 内部的分号。
  bool multi_statement = 3;
}

// v2.16: 多语句脚本的逐条执行结果（index 从 0 开始）。
message SqlStatementResult {
  int32  index         = 1;
  string sql           = 2;   // 回显该条语句（已 trim）
  int32  affected_rows = 3;
  bool   success       = 4;
  string error         = 5;   // 该条失败时的说明（success=false）
}
message SqlExplainRequest { string sql = 1; string schema = 2; }
message SqlRequest {
  oneof body {
    SqlExecuteRequest execute = 1;
    SqlExplainRequest explain = 2;
  }
}

// ---------- FUNCTION ----------
message FunctionListRequest    { string schema = 1; }
message FunctionInfoRequest    { string name = 1; string schema = 2; }
message FunctionGetDdlRequest  { string name = 1; string schema = 2; }
message FunctionCreateRequest  { string ddl = 1; }
message FunctionDeleteRequest {
  string name = 1;
  string routine_type = 2;   // FUNCTION | PROCEDURE
  string schema = 3;
  bool   if_exists = 4;
  bool   cascade   = 5;
}
message FunctionCallRequest {
  string name = 1;
  string routine_type = 2;
  string schema = 3;
  repeated string args = 4;
}
message FunctionDebugRequest   { string name = 1; string schema = 2; }
message FunctionValidateRequest { string ddl = 1; }
message FunctionRequest {
  oneof body {
    FunctionListRequest    list    = 1;
    FunctionInfoRequest    info    = 2;
    FunctionGetDdlRequest  get_ddl = 3;
    FunctionCreateRequest  create  = 4;
    FunctionDeleteRequest  delete  = 5;
    FunctionCallRequest    call    = 6;
    FunctionDebugRequest   debug   = 7;
    FunctionValidateRequest update = 8;   // Action.UPDATE maps to validate
  }
}

// ---------- VIEW ----------
message ViewListRequest   { string schema = 1; }
message ViewCreateRequest { string name = 1; string definition = 2; string schema = 3; }
message ViewDeleteRequest { string name = 1; bool if_exists = 2; string schema = 3; }
message ViewGetDdlRequest { string name = 1; string schema = 2; }
message ViewRequest {
  oneof body {
    ViewListRequest   list    = 1;
    ViewCreateRequest create  = 2;
    ViewDeleteRequest delete  = 3;
    ViewGetDdlRequest get_ddl = 4;
  }
}

// ---------- INDEX ----------
message IndexListRequest   { string table_name = 1; string schema = 2; }
message IndexCreateRequest {
  string table_name = 1;
  string index_name = 2;
  repeated string columns = 3;
  bool   unique = 4;
  string schema = 5;
  optional bool if_not_exists = 6;
}
message IndexDeleteRequest {
  string index_name = 1;
  string table_name = 2;
  string schema = 3;
  optional bool if_exists = 4;
}
message IndexRequest {
  oneof body {
    IndexListRequest   list   = 1;
    IndexCreateRequest create = 2;
    IndexDeleteRequest delete = 3;
  }
}

// ---------- FOREIGN_KEY ----------
message ForeignKeyListRequest   { string table_name = 1; string schema = 2; }
message ForeignKeyCreateRequest {
  string table_name = 1;
  string fk_name    = 2;
  repeated string columns     = 3;
  string ref_table            = 4;
  repeated string ref_columns = 5;
  string on_delete = 6;
  string on_update = 7;
  string schema = 8;
}
message ForeignKeyDeleteRequest {
  string table_name = 1;
  string fk_name    = 2;
  string schema     = 3;
  optional bool if_exists = 4;
}
message ForeignKeyRequest {
  oneof body {
    ForeignKeyListRequest   list   = 1;
    ForeignKeyCreateRequest create = 2;
    ForeignKeyDeleteRequest delete = 3;
  }
}

// ---------- TRIGGER ----------
message TriggerListRequest   { string schema = 1; }
message TriggerGetDdlRequest { string name = 1; string schema = 2; }
message TriggerRequest {
  oneof body {
    TriggerListRequest   list    = 1;
    TriggerGetDdlRequest get_ddl = 2;
  }
}

// ---------- EXPORT ----------
message ExportRunRequest {
  string sql        = 1;
  string output_dir = 2;
  string file_name  = 3;
  string format     = 4;   // CSV | JSON_LINES | SQL_INSERT | EXCEL | PARQUET
  string table_name = 5;   // required when format=SQL_INSERT
  int32  fetch_size = 6;   // default 1000
  string stop_export_id = 7; // when set, cancels that task
}
message ExportRequest {
  ExportRunRequest run_export = 1;
}

// ---------- IMPORT (v2.16) ----------
// 数据导入：把本地文件读成行，批量插入目标表 —— 与 EXPORT 对称的读方向。
message ImportRequest {
  ImportRunRequest run_import = 1;
}

message ImportRunRequest {
  string file_path  = 1;    // 待导入的本地文件绝对路径
  string format     = 2;    // CSV | JSON_LINES
  string table_name = 3;    // 目标表（必填）
  string schema     = 4;
  int32  batch_size = 5;    // 每批 insert 的行数，default 500

  // ---- CSV 专用 ----
  string delimiter  = 6;    // default ","
  // default true。用 `optional` 保留 presence 语义：proto3 的裸 bool 无法区分
  // 「调用方没传」和「显式传 false」，而这两者的意图完全相反（有表头 vs 无表头），
  // 猜错就会把首行数据当成表头吃掉。与 DataListRequest.page_size 同一套处理。
  optional bool has_header = 7;
  string encoding   = 8;    // default UTF-8

  // ---- 通用 ----
  bool truncate_first = 9;  // 导入前 TRUNCATE 目标表
  bool ignore_errors  = 10; // true = 跳过坏行继续并计入 rows_failed；false = 遇错即停
  string stop_import_id = 11; // 设置为运行中的导入 id 即取消该任务（与 stop_export_id 同构）
}

// ---------- ANALYSIS (v2.29) ----------
// 数据分析模式的四条路由。它们的共同点是**只读源元数据** + **在计算引擎上跑 SQL**。
//
// 为什么源元数据要另起一个 Category，而不是复用 SCHEMA.LIST / TABLE.LIST：
// 分析模式的源会话带 read_only 标记，而**分析流量在协议层要能一眼认出来**
// （主设计 §3.5 的 L5「API 面才是窄门」）。复用浏览模式的路由会让
// 「这条请求属于分析会话」这件事只存在于前端的一个布尔变量里 ——
// 引擎就再也说不清了。
message AnalysisRequest {
  oneof body {
    AnalysisListSourcesRequest list_sources = 1;
    AnalysisListTablesRequest  list_tables  = 2;
    AnalysisListColumnsRequest list_columns = 3;
    AnalysisRunQueryRequest    run_query    = 4;
    AnalysisPullRequest        pull         = 5;
  }
}

// 列该连接的「命名空间」。
//
// 「命名空间」是个中性叫法：**MySQL 上它是库，PG 上它是 schema** ——
// 两者对 SPI 都是 listTables(conn, namespace) 的同一个参数位。
// （浏览模式早就是这么用的：TablePreviewTab.schema 那个字段装的一直是**库名**。）
//
// 无参：命名空间列表由**连接配置**决定（PG 的库在 connection.database 里）。
message AnalysisListSourcesRequest { }

// 列远端表。namespace 为空 = 该连接下的全部（由方言决定语义）。
message AnalysisListTablesRequest  { string namespace = 1; }

// 列远端列。
message AnalysisListColumnsRequest { string namespace = 1; string table = 2; }

// 在计算引擎上跑分析 SQL。
//
// ⚠️ 引擎侧会校验目标方言**声明了 EMBEDDED_MODE**（本地嵌入式）——
// 见主设计 §3.4：这条路由必须能写（工作区里的 CREATE TABLE tmp AS SELECT …），
// 所以不能被只读闸门挡；但它绝不能打在远端上，否则就是绕过闸门的后门。
message AnalysisRunQueryRequest    { string sql = 1; }

// 远端的那张表**怎么**进到工作区。
//
// ## 为什么要有这个选择
//
// 两条通路的**类型映射不一样**：
//
// | 远端列 | 纯 Java 表函数（我们的映射） | DuckDB 官方扩展 |
// |---|---|---|
// | MySQL `TINYINT(1)` | `INTEGER` | `BOOLEAN` |
// | MySQL `BIT(1)` | `INTEGER` | `BOOLEAN` |
//
// 「拉取远端表」一直用**纯 Java** —— 类型映射是我们定的，跨机器一致。
// 而「添加数据源」要的是**DuckDB 原生接入**（官方扩展优先，走不通再退回 JDBC）。
//
// 两种诉求都合理，于是**由请求说明走哪条** —— 而不是拧一个全局开关、
// 让两条路由悄悄换掉类型映射（那样「同一张表」从不同入口进来类型可能不同，
// 而用户看到的表是同一张）。
enum AnalysisAccessMode {
  // 纯 Java 表函数（**当前实现**）：类型映射是我们定的，跨机器一致。
  ANALYSIS_ACCESS_MODE_UNSPECIFIED = 0;
  // **DuckDB 官方扩展优先**；扩展走不通（没装 / 加载失败 / 远端不认这个 URI）
  // 就**退回**纯 Java 表函数 —— 用户看到的是「成功」，不是「你的扩展没装」。
  ANALYSIS_ACCESS_MODE_EXTENSION_FIRST = 1;
}

// 把远端的一张表拉进**本地工作区**（DuckDB）。
//
// ⚠️ 这条路由**不再走「导出 CSV → 导入 CSV」**（那是 v2.29 初稿的做法，
// 已被证明是绕远路）：DuckDB 自己就能当**联邦查询层** ——
// 它能直接连远端 JDBC 数据源，把远端的行**流式**读进来。
// 于是这条路由在引擎侧就是一句话：
//
//     CREATE TABLE <落点> AS SELECT * FROM <联邦扫描>
//
// 临时文件、磁盘往返、CSV 的 NULL → 空串陷阱，**全部消失**。
//
// 为什么远端配置要**单独**放在请求体里（而不是复用 Request.connection）：
// 一次拉取要碰**两个**数据库 —— 远端（读）与工作区（写）——
// 而 `Request.connection` 只有一个位置，给了工作区（落点在那儿）。
// 另一个只能走请求体，这也正是「凭据不进 SQL 文本」的前提：
// 凭据只存在于这条消息里，绝不会被拼进要执行的 SQL。
message AnalysisPullRequest {
  // 远端连接配置（**含凭据**）—— 引擎用它开一条只读的 JDBC 连接。
  // 凭据只在引擎进程内使用，不回显、不写日志、不进 SQL 文本。
  ConnectionConfig remote = 1;
  // 远端的命名空间（MySQL 上是库，PG 上是 schema）。
  string namespace = 2;
  // 远端表名。
  string table = 3;
  // 工作区里的落点表名（由前端按共享规则算好：`staging_<源库>_<表>`）。
  // 放在请求体里而不是让引擎自己算 —— 那条命名规则住在前端的共享包里，
  // 引擎看不见它，两处各写一份就是两个真相源。
  string staging_table = 4;
  // 落点所在的 **schema**（工作区里的）。空串 = 落点就在 `main` 里
  // （「拉取远端表」那条路由一直以来的行为）。
  //
  // 为什么要有它：「添加数据源」把每个数据源的表放进**自己的 schema**
  // （`src_<源>`）—— 那样两个源里有同名表也不会撞，
  // 而且树里能按源分组。引擎只管把表落进去，不决定它落在哪。
  string target_schema = 5;
  // 走哪条通路（见 [AnalysisAccessMode]）。不填 = 纯 Java 表函数。
  AnalysisAccessMode access_mode = 6;
}

// ============================================================================
// Request envelope
// ============================================================================

message Request {
  string id = 1;
  Category category = 2;
  Action   action   = 3;
  ConnectionConfig connection = 4;

  // Cross-cutting options (v2.6): applied uniformly to all (Category, Action) routes.
  RequestOptions options = 5;
  // v2.16: 事务会话 id —— 由 SYSTEM.BEGIN 分配。留空 = 无事务（每条语句独立提交，即原有行为）。
  // 非空时，所有 DATA 写操作与 SQL.DML 都在该会话**固定的那条连接**上执行，
  // 直到 SYSTEM.COMMIT / SYSTEM.ROLLBACK 结束会话。
  string session_id = 6;

  oneof body {
    SystemRequest    system_request    = 10;
    SchemaRequest    schema_request    = 11;
    UserRequest      user_request      = 12;
    TableRequest     table_request     = 13;
    DataRequest      data_request      = 14;
    SqlRequest       sql_request       = 15;
    FunctionRequest  function_request  = 16;
    ViewRequest      view_request      = 17;
    IndexRequest     index_request     = 18;
    ForeignKeyRequest foreign_key_request = 19;
    TriggerRequest   trigger_request   = 20;
    ExportRequest    export_request    = 21;
    ImportRequest    import_request    = 22;  // v2.16
    AnalysisRequest  analysis_request  = 23;  // v2.29
  }
}

// ============================================================================
// Cross-cutting Request options (v2.6)
// ============================================================================
//
// Read by the dispatcher before invoking any handler.
// - trace_id:   MDC propagation key — appears in every log line for this request.
// - dry_run:    write actions (CREATE/UPDATE/DELETE/TRUNCATE/RENAME/RUN_EXPORT/
//               GENERATE) execute inside a transaction that is always rolled back.
//               Read actions pass through unchanged.
// - timeout_ms: 0 = no timeout (default). >0 wraps the handler call in
//               withTimeoutOrNull; on cancel the dispatcher emits a Response with
//               success=false, error="Request timed out after Nms".
message RequestOptions {
  string trace_id   = 1;
  bool   dry_run    = 2;
  int32  timeout_ms = 3;

  // 界面语言（BCP-47，如 "de" / "zh-Hant"）。引擎用它挑选**会显示到界面上的**
  // 错误消息语言 —— `Response.error` 的内容是原样上屏的（见 RequestDispatcher 的
  // catch 分支），所以界面的语言必须一路带到引擎，否则德语界面里会蹦出中文报错。
  //
  // 为什么放在 RequestOptions 而不是 ConnectionConfig：它与「连哪个库」毫无关系，
  // 是纯粹随请求走的一次性上下文，正是 RequestOptions 的职责。
  //
  // 留空 = 引擎按自身的 `Locale.getDefault()` 推断（见 LanguageScope）。
  // 字段号 4 之前未占用，向后兼容：老客户端不填时行为不变。
  string language   = 4;
}

// ============================================================================
// Per-Category RESPONSE bodies
// ============================================================================

// List items below are typed per-message (replacing `repeated google.protobuf.Value`).
// A `Row` wraps a dynamic `map<string, Value>` so individual cell values stay as `Value`
// (cells are scalar / LOB-typed) while the row envelope itself is typed.

// ---------- SCHEMA ----------
message SchemaListResponse {
  string level    = 1;
  string database = 2;
  repeated string items = 3;   // database names or schema names
}
message SchemaCreateResponse { string created = 1; }
message SchemaDeleteResponse { string deleted = 1; }
message SchemaResponse {
  oneof body {
    SchemaListResponse   list   = 1;
    SchemaCreateResponse create = 2;
    SchemaDeleteResponse delete = 3;
  }
}

// ---------- USER ----------
// UserListItem is used by GRANTS (single, structured shape across dialects).
message UserGrantItem {
  string schema    = 1;
  string table     = 2;
  string privilege = 3;   // comma-separated for aggregated grants
}
// UserListResponse is overloaded: returns either user list (USER.LIST w/o `user`)
// or privileges list (USER.LIST with `user`). Shapes vary by dialect, so keep Value.
message UserListResponse       { repeated google.protobuf.Value items = 1; }
message UserCreateResponse     { string created = 1; }
message UserDeleteResponse     { string deleted = 1; }
message UserUpdateResponse {
  string user    = 1;
  string schema  = 2;
  string table   = 3;
  string action  = 4;
  bool with_grant_option = 5;
}
message UserGrantsResponse     { repeated UserGrantItem items = 1; }
message UserResponse {
  oneof body {
    UserListResponse   list   = 1;
    UserCreateResponse create = 2;
    UserUpdateResponse update = 3;
    UserDeleteResponse delete = 4;
    UserGrantsResponse grants = 5;
  }
}

// ---------- TABLE ----------
message TableListItem {
  string name = 1;
  string type = 2;   // TABLE | VIEW | ...
}
message TableListResponse       { repeated TableListItem items = 1; }
message TableColumnListResponse { repeated ColumnDef items = 1; }
message TableCreateResponse     { string created = 1; }
message TableUpdateResponse {
  string table_name = 1;
  string operation  = 2;
}
message TableDeleteResponse     { string deleted = 1; }
message TableGetDdlResponse     { string ddl = 1; }
message TableRenameResponse {
  string renamed = 1;
  string new_name = 2;
}
message TableTruncateResponse   { string truncated = 1; }
message TableResponse {
  oneof body {
    TableListResponse       list     = 1;
    TableColumnListResponse columns  = 2;
    TableCreateResponse     create   = 3;
    TableUpdateResponse     update   = 4;
    TableDeleteResponse     delete   = 5;
    TableGetDdlResponse     get_ddl  = 6;
    TableRenameResponse     rename   = 7;
    TableTruncateResponse   truncate = 8;
  }
}

// ---------- DATA ----------
// A typed wrapper around a dynamic column → value map.
message Row {
  map<string, google.protobuf.Value> values = 1;
}

// 空串与 SQL NULL 的关系 —— 前端**必须**按它决定「清空输入框」写什么。
enum EmptyValuePolicy {
  // 旧引擎 / 未声明：前端按「未知」处理 —— 禁用写入口，不要猜。
  EMPTY_VALUE_UNSPECIFIED = 0;
  // 空串写 SQL NULL。
  EMPTY_AS_NULL  = 1;
  // 空串就写空串。**当前实现**：绝大多数用户「清空一个文本框」指的是清成空串，
  // 而不是把字段变成 NULL；两者在查询、导出、唯一索引上行为都不同，猜错会静默改坏数据。
  // 要写 NULL 必须走 `null_columns` 显式声明（见 DataCreateRequest）。
  EMPTY_AS_STRING = 2;
}

// 表数据能力 —— 随 `DATA.LIST` 一起返回，前端据此决定「编辑 / 新增 / 删除」入口能不能用。
//
// 为什么必须由引擎回答：能不能写取决于这张表的**列定义**（有没有主键、哪些是自增、
// 哪些是二进制）与**对象类型**（视图即使部分可写也不放行），这些只有
// `dialect.listColumns` 答得上来。
//
// `DataListPagedResponse` 里用 `optional` 包它：新前端配老引擎时字段缺省，
// 前端据此一律**禁用**写入口 —— 宁可不给编辑，也不要拿未确认的列名去发 UPDATE。
message TableCapabilities {
  // 有主键，且对象是真表（不是视图）。false 时编辑与删除入口都禁用。
  bool can_update = 1;
  // 至少有一列可填（排除自增列与二进制列）。
  bool can_insert = 2;
  // 有主键，且对象是真表。与 can_update 同一判据，但语义独立，单列出来给。
  bool can_delete = 3;
  // 不可编辑的列：主键列 + 二进制列。`DATA.LIST` 对二进制列回的是 "[LOB Data]"
  // 占位串而不是真实内容，写回去等于用一句提示语覆盖掉用户的数据。
  repeated string read_only_columns  = 4;
  // 可编辑的列 = 全部列 − read_only_columns。
  repeated string editable_columns   = 5;
  // 新增时可填的列 = 全部列 − 自增列 − 二进制列（自增列交给数据库生成）。
  repeated string insertable_columns = 6;
  EmptyValuePolicy empty_value_policy = 7;
  // 允许取 NULL 的列。前端据此决定编辑框里画不画「设为 NULL」的开关 ——
  // 往 `NOT NULL` 列写 NULL 是**必然**失败的操作，给用户一个点下去就报错的按钮没有意义。
  repeated string nullable_columns     = 8;
  // 主键列（按列序）。与 [TableCapabilities.read_only_columns] 分开给，因为两者用途不同：
  // `read_only_columns` 回答「这一格能不能改」，主键列回答「**用哪几列去定位这一行**」。
  // 复合主键必须**整组**返回 —— 只带一列去 `WHERE` 不是唯一条件，会一次改掉多行。
  repeated string primary_key_columns  = 9;
}
message DataListPagedResponse {
  int64 total = 1;
  int32 page = 2;
  int32 page_size = 3;
  repeated Row rows = 4;
  optional TableCapabilities capabilities = 5;  // v2.17
}
message DataCreateResponse { int32 affected_rows = 1; }
message DataUpdateResponse { int32 affected_rows = 1; }
message DataDeleteResponse { int32 affected_rows = 1; }
message DataResponse {
  oneof body {
    DataListPagedResponse list   = 1;
    DataCreateResponse    create = 2;
    DataUpdateResponse    update = 3;
    DataDeleteResponse    delete = 4;
  }
}

// Streaming frame for DATA.LIST (pageSize=0) — one frame per row.
message DataRowFrame {
  int64 total = 1;
  int32 page = 2;     // always 0 for streaming
  int32 page_size = 3; // always 1 for streaming
  Row row = 4;
}

// ---------- SQL ----------
message SqlSelectRowFrame {
  int64 total = 1;     // always -1 for SELECT streaming
  int32 page = 2;
  int32 page_size = 3;
  Row row = 4;
}
message SqlExecuteResponse {
  int32 affected_rows = 1;   // 单条语句 = 该语句行数；多语句 = 全部成功语句行数合计
  // v2.16: 仅 multi_statement=true 时逐条填充（顺序即执行顺序）
  repeated SqlStatementResult statements = 2;
}
message SqlExplainResponse {
  repeated Row rows = 1;
}
message SqlResponse {
  oneof body {
    SqlExecuteResponse execute = 1;
    SqlExplainResponse explain = 2;
  }
}

// ---------- SYSTEM ----------
message SystemInfoResponse {
  string jvm_version = 1;
  string jvm_vendor  = 2;
  string jvm_name    = 3;
  string os_name     = 4;
  string os_arch     = 5;
  string os_version  = 6;
  int32  available_processors = 7;
  MemoryInfo memory = 8;
  int64 uptime = 9;     // milliseconds
  int64 pid    = 10;
}
message MemoryInfo {
  int64 max   = 1;     // bytes
  int64 total = 2;
  int64 used  = 3;
  int64 free  = 4;
}
message SystemTestConnectionResponse {
  bool   ok       = 1;
  string driver   = 2;
  string host     = 3;
  int32  port     = 4;
  string database = 5;
  string error    = 6;   // populated when ok=false
}

// SYSTEM.DISCONNECT (v2.15) — 释放某连接配置下的全部 HikariCP 连接池（含各 schema 维度）。
// 与 TEST_CONNECTION 对称：前者建池（= 初始化连接），本者释放池。
// 远端调用方（gRPC 客户端）据此获得与本地进程内调用一致的连接生命周期语义。
message SystemDisconnectResponse {
  bool closed = 1;   // true = 确实关闭了至少一个连接池；false = 该配置当前没有活跃池
}
message SystemServerInfoResponse {
  string version = 1;
  string catalog = 2;   // MySQL
  string current_database = 3;  // PG
  string mode    = 4;   // H2
  // dialect-specific extras packed as Value
  google.protobuf.Value extras = 10;
}

// ---------- SYSTEM.LIST_DRIVERS (v2.8) ----------
// 列出已加载的所有方言插件 + 每方言连接元数据，前端据此动态渲染连接表单。
message DialectInfo {
  string driver_name              = 1;   // "Mysql" / "Postgresql" / "H2" / "Duckdb" / "Sqlite"
  string display_name             = 2;   // "MySQL" / "PostgreSQL 16" / "DuckDB (Embedded)"
  string jdbc_driver_class_name   = 3;
  string jdbc_url_example         = 4;   // 占位符 / 文档用示例 URL
  string connection_type          = 5;   // "CLIENT_SERVER" | "EMBEDDED" | "FILE_BASED" | "IN_MEMORY"
  bool   requires_host            = 6;   // host 字段是否必填（true = 显示 + 必填）
  bool   requires_port            = 7;   // port 字段是否必填
  int32  default_port             = 8;   // 0 表示无默认（如嵌入式方言）
  bool   supports_user            = 9;   // user 字段是否相关
  bool   supports_password        = 10;  // password 字段是否相关
  bool   supports_schema          = 11;  // schema 二级导航
  bool   supports_cross_database  = 12;  // 跨库查询
  // 能力标签集合（VIEWS / INDEXES / FOREIGN_KEYS / TRIGGERS / USERS / PRIVILEGES /
  //               ROUTINES / CROSS_DATABASE / MULTI_SCHEMA / EXPORT / DDL_TRANSACTION /
  //               EMBEDDED_MODE）。前端按集合显隐对应按钮/菜单。
  repeated string capabilities    = 13;
  // 连接表单规格（v2.29）—— 方言自描述「连得上要填什么」。
  //
  // ⚠️ 这**不是** per-connection 的字段：它随 LIST_DRIVERS 一次性下发
  // （SYSTEM.INFO 那样的纯元数据查询，不需要连接），不是每次建连接都跑一遍。
  //
  // **不设置**（has_connection_form() == false）表示「该方言没声明表单」——
  // 前端据此**回退旧的枚举分支**（见设计文档 §5.7 的 Q6 结论）。
  // 这与「声明了但字段为空」是两件事，前端要分得开。
  //
  // 消息字段在 proto3 里天然带存在性（presence），所以不需要 optional。
  DialectForm connection_form = 14;
}

// 连接表单规格（v2.29）—— 与 dialect-contract 模块的 ConnectionFormSpec 一一对应。
message DialectForm {
  // 每种连接类型一份表单（"CLIENT_SERVER" / "EMBEDDED" / "IN_MEMORY" / "FILE_BASED"）。
  // 同一份 spec 里可以有多份：H2 的内存库与文件库形状不同。
  repeated DialectFormVariant forms = 1;
  // 认证方式（"PASSWORD" / "KERBEROS" / "NONE"）。长度为 1 时前端不渲染下拉。
  repeated string auth_methods = 2;
  // 默认端口；0 表示无默认（嵌入式方言）。
  int32 default_port = 3;
}

// 一份表单 —— 某个连接类型下的字段清单。
message DialectFormVariant {
  // 连接类型名，与前端 ConnectionType.name 同名。
  string connection_type = 1;
  // 字段清单，**顺序即渲染顺序**。
  repeated DialectFormField fields = 2;
}

// 一个表单字段。
message DialectFormField {
  // 字段 id。约定 id："host" / "port" / "database" / "username" / "password" / "jdbcUrl"
  //（对应 ConnectionConfig 的固定字段）；其余 id 落进 ConnectionConfig.properties。
  string id = 1;
  // 标签的文案键 —— i18n StrKey 的枚举名（不是译文本身）。
  string label_key = 2;
  // 字段类型："TEXT" / "PASSWORD" / "INT" / "CHOICE" / "DISPLAY"。
  string type = 3;
  bool required = 4;
  // 敏感值：界面上要掩码、导出配置时要剔除。
  bool secret = 5;
  // 下拉候选（type == "CHOICE" 时有效）。
  repeated string choices = 6;
  // 占位提示的文案键（StrKey 名）；空串 = 没有。
  string placeholder_key = 7;
  // 占位提示的字面量（不翻译，例如 JDBC URL 示例）；空串 = 没有。
  string placeholder = 8;
  // 该字段在哪些认证方式下出现；空 = 所有认证方式下都出现。
  repeated string auth_methods = 9;
  // 该字段之前是否画一条分隔线。
  bool separator_before = 10;
  // 该字段是否是多行输入（JDBC URL 这类长文本）。
  bool multiline = 11;
}
message SystemListDriversResponse {
  repeated DialectInfo items = 1;
}

message SystemResponse {
  oneof body {
    SystemInfoResponse           info            = 1;
    SystemTestConnectionResponse test_connection = 2;
    SystemServerInfoResponse     server_info     = 3;
    SystemListDriversResponse    list_drivers    = 4;   // v2.8
    SystemDisconnectResponse     disconnect      = 5;   // v2.15
    SystemCancelResponse         cancel          = 6;   // v2.16
    SystemBeginResponse          begin           = 7;   // v2.16
    SystemCommitResponse         commit          = 8;   // v2.16
    SystemRollbackResponse       rollback        = 9;   // v2.16
    SystemSessionInfoResponse    session_info    = 10;  // v2.16
  }
}

// ---------- SYSTEM.CANCEL (v2.16) ----------
// 取消正在执行的请求。引擎侧对运行中的 JDBC Statement 调用 Statement.cancel()，
// 被取消的请求以原本的请求 id 返回一条 success=false、error="cancelled" 的终止帧。
message SystemCancelResponse {
  bool   cancelled  = 1;   // true = 找到目标且已发出取消
  string request_id = 2;   // 被取消的请求 id（回显，便于调用方对齐）
  string error      = 3;   // 未找到 / 取消失败时的说明
}

// ---------- SYSTEM 事务会话 (v2.16) ----------
// BEGIN 之后引擎为该会话固定一条 JDBC 连接并置 autocommit=false；
// 同一 session_id 的后续请求全部落在这条连接上，直到 COMMIT / ROLLBACK。
message SystemBeginResponse {
  string session_id = 1;
  int64  started_at = 2;   // epoch millis
  string driver     = 3;
  string database   = 4;
}
message SystemCommitResponse {
  string session_id = 1;
  bool   committed  = 2;
  string error      = 3;    // 会话不存在 / commit 失败时的说明
}
message SystemRollbackResponse {
  string session_id  = 1;
  bool   rolled_back = 2;
  string error       = 3;
}
message TransactionSession {
  string session_id  = 1;
  int64  started_at  = 2;
  string driver      = 3;
  string database    = 4;
  string schema      = 5;
  bool   auto_commit = 6;   // 会话内恒为 false
}
message SystemSessionInfoResponse {
  int32 active_sessions = 1;
  repeated TransactionSession sessions = 2;
}

// ---------- FUNCTION ----------
message FunctionListItem {
  string name             = 1;
  string routine_type     = 2;   // FUNCTION | PROCEDURE | TRIGGER
  string return_type      = 3;
  string language         = 4;
  string security_definer = 5;
  string volatility       = 6;
  string arg_count        = 7;
  string arg_names        = 8;
  string schema           = 9;
  string description      = 10;
  string trigger_table    = 11;
}
message FunctionListResponse    { repeated FunctionListItem items = 1; }
message FunctionInfoResponse    { google.protobuf.Value info = 1; }   // dialect-specific shape
message FunctionGetDdlResponse  { string ddl = 1; }
message FunctionCreateResponse  {
  bool success = 1;
  string message = 2;
}
message FunctionDeleteResponse {
  bool success = 1;
  string message = 2;
  string name = 3;
  string routine_type = 4;
}
message FunctionCallResponse    { google.protobuf.Value result = 1; }   // dialect-specific
message FunctionDebugItem {
  string type   = 1;   // EXPLAIN | INFO | DEPENDENCIES
  string output = 2;
}
message FunctionDebugResponse   { repeated FunctionDebugItem items = 1; }
message FunctionValidateResponse {
  bool valid = 1;
  string message = 2;
}
message FunctionResponse {
  oneof body {
    FunctionListResponse    list    = 1;
    FunctionInfoResponse    info    = 2;
    FunctionGetDdlResponse  get_ddl = 3;
    FunctionCreateResponse  create  = 4;
    FunctionDeleteResponse  delete  = 5;
    FunctionCallResponse    call    = 6;
    FunctionDebugResponse   debug   = 7;
    FunctionValidateResponse update = 8;
  }
}

// ---------- VIEW ----------
message ViewListItem {
  string name       = 1;
  string type       = 2;
  string definition = 3;
}
message ViewListResponse   { repeated ViewListItem items = 1; }
message ViewCreateResponse { string created = 1; }
message ViewDeleteResponse { string deleted = 1; }
message ViewGetDdlResponse { string ddl = 1; }
message ViewResponse {
  oneof body {
    ViewListResponse   list    = 1;
    ViewCreateResponse create  = 2;
    ViewDeleteResponse delete  = 3;
    ViewGetDdlResponse get_ddl = 4;
  }
}

// ---------- INDEX ----------
message IndexListItem {
  string             name       = 1;
  string             table      = 2;
  repeated string    columns    = 3;
  bool               unique     = 4;
  string             type       = 5;   // BTREE | HASH | ...
  string             definition = 6;   // dialect-specific fallback (PG/H2 use this instead of columns)
}
message IndexListResponse   { repeated IndexListItem items = 1; }
message IndexCreateResponse {
  string created = 1;
  string table_name = 2;
}
message IndexDeleteResponse { string deleted = 1; }
message IndexResponse {
  oneof body {
    IndexListResponse   list   = 1;
    IndexCreateResponse create = 2;
    IndexDeleteResponse delete = 3;
  }
}

// ---------- FOREIGN_KEY ----------
message ForeignKeyListItem {
  string             name        = 1;
  string             table       = 2;
  repeated string    columns     = 3;
  string             ref_table   = 4;
  repeated string    ref_columns = 5;
  string             on_delete   = 6;
  string             on_update   = 7;
}
message ForeignKeyListResponse   { repeated ForeignKeyListItem items = 1; }
message ForeignKeyCreateResponse {
  string created = 1;
  string table_name = 2;
}
message ForeignKeyDeleteResponse { string deleted = 1; }
message ForeignKeyResponse {
  oneof body {
    ForeignKeyListResponse   list   = 1;
    ForeignKeyCreateResponse create = 2;
    ForeignKeyDeleteResponse delete = 3;
  }
}

// ---------- TRIGGER ----------
message TriggerListItem {
  string name      = 1;
  string table     = 2;
  string event     = 3;
  string timing    = 4;
  string statement = 5;
}
message TriggerListResponse   { repeated TriggerListItem items = 1; }
message TriggerGetDdlResponse { string ddl = 1; }
message TriggerResponse {
  oneof body {
    TriggerListResponse   list    = 1;
    TriggerGetDdlResponse get_ddl = 2;
  }
}

// ---------- EXPORT ----------
message ExportProgressFrame {
  int64  exported_rows = 1;
  int32  column_count  = 2;
  bool   completed     = 3;
  string file_path     = 4;  // populated on terminal frame
  string error         = 5;  // populated on terminal frame if cancelled
}
message ExportStopResponse { string stopped = 1; }
message ExportResponse {
  oneof body {
    ExportProgressFrame progress = 1;
    ExportStopResponse  stop     = 2;
  }
}

// ---------- IMPORT 响应 (v2.16) ----------
// 进度帧：每读入 N 行推一帧；终止帧携带最终统计。
message ImportProgressFrame {
  int64  rows_read     = 1;
  int64  rows_inserted = 2;
  int64  rows_failed   = 3;
  string message       = 4;   // 人类可读进度（如 "inserted 500"）
}
message ImportResultResponse {
  int64  rows_read     = 1;
  int64  rows_inserted = 2;
  int64  rows_failed   = 3;
  bool   success       = 4;
  string error         = 5;
}
message ImportResponse {
  oneof body {
    ImportProgressFrame progress = 1;
    ImportResultResponse result  = 2;
  }
}

// Streaming frame for DATA.GENERATE — one frame per INSERT.
message GenerateProgressFrame {
  string table             = 1;
  int64  inserted          = 2;
  int64  script_inserted   = 3;
  int32  script_index      = 4;
  int32  total_scripts     = 5;
  string sql               = 6;
  Row data = 7;            // the inserted row payload (typed wrapper)
}
message GenerateTerminalResponse {
  bool success = 1;
  int32 tables_processed = 2;
}

// ---------- ANALYSIS 响应 (v2.29) ----------
//
// 三个列表响应**复用既有消息**（TableListItem / ColumnDef / Row），不另立类型 ——
// 「同一个概念只该有一个消息类型」：另立一份 `AnalysisTableItem` 只会让
// 引擎与前端多一次互转，而两边的字段完全一样。
message AnalysisListSourcesResponse { repeated string items = 1; }         // 命名空间名
message AnalysisListTablesResponse  { repeated TableListItem items = 1; }  // 复用
message AnalysisListColumnsResponse { repeated ColumnDef items = 1; }      // 复用

// 分析查询的结果。
//
// 为什么是**单次响应**而不是流式：浏览模式的 DATA.LIST 也是这么返回行的；
// 行数上限复用 SQL_RESULT_MAX_ROWS（5000，与浏览模式一致），
// 超了用 truncated 显式告知 —— 静默截断等于骗人。
message AnalysisRunQueryResponse {
  repeated Row rows = 1;           // 复用（map<string, Value>）
  repeated ColumnDef columns = 2;  // 复用
  int32  affected_rows = 3;
  bool   truncated = 4;
}

message AnalysisResponse {
  oneof body {
    AnalysisListSourcesResponse list_sources = 1;
    AnalysisListTablesResponse  list_tables  = 2;
    AnalysisListColumnsResponse list_columns = 3;
    AnalysisRunQueryResponse    run_query    = 4;
    AnalysisPullResponse       pull         = 5;
  }
}

// 拉取的终态（终止帧携带）。
message AnalysisPullResponse {
  string staging_table = 1;  // 落到工作区里的表名
  int64  rows          = 2;  // 实际落地的行数
  int64  elapsed_ms    = 3;  // 耗时（毫秒）
  // 是不是**用户取消**的。
  //
  // 为什么要有这个布尔而不是让调用方去比对错误文本：取消**不是失败** ——
  // 界面上要分开说（"拉取已取消" vs "拉取失败：…"），
  // 而「靠字符串判断」那种写法在文案一改就会失效。
  bool   cancelled     = 4;
}

// 拉取的进度帧 —— 每读完一批行推一帧。
//
// ⚠️ 「已扫描行数」是**远端**的行数：联邦扫描是流式的，
// 行还在路上时它们已经在远端读出来了。
message AnalysisPullProgressFrame {
  int64  rows  = 1;   // 已从远端读出的行数
  string stage = 2;   // 阶段：scan（扫描远端）/ load（写入工作区）
}

// ============================================================================
// Response envelope
// ============================================================================

message Response {
  string id = 1;
  bool   success = 2;
  string error   = 3;
  bool   stream  = 4;
  bool   end     = 5;

  oneof body {
    // Per-Category single-shot responses
    SchemaResponse     schema     = 10;
    UserResponse       user       = 11;
    TableResponse      table      = 12;
    DataResponse       data       = 13;
    SqlResponse        sql        = 14;
    SystemResponse     system     = 15;
    FunctionResponse   function   = 16;
    ViewResponse       view       = 17;
    IndexResponse      index      = 18;
    ForeignKeyResponse foreign_key = 19;
    TriggerResponse    trigger    = 20;
    ExportResponse     export     = 21;
    GenerateTerminalResponse generate_terminal = 22;
    ImportResponse     import     = 23;  // v2.16
    AnalysisResponse   analysis   = 24;  // v2.29

    // Streaming frames (one per row / progress event)
    DataRowFrame          data_row_frame  = 30;
    SqlSelectRowFrame     sql_row_frame   = 31;
    GenerateProgressFrame gen_progress_frame = 32;
    ImportProgressFrame import_progress = 33;  // v2.16
    AnalysisPullProgressFrame analysis_pull_progress = 34;  // v2.29
  }
}

// ============================================================================
// Service
// ============================================================================

service IdbEngine {
  rpc Handle(Request) returns (stream Response);
}
