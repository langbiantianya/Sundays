#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# —— JDK 版本：全仓库的**单点来源** ——
#
# 三处用它，且必须是同一个版本：
#   ① 根 build.gradle.kts 的 jvmToolchain —— 编译目标（字节码 major=69）
#   ② desktopApp 的 run / hotRun —— 运行 JVM
#   ③ desktopApp 的 jlink / jpackage —— 打包工具（与安装包内的运行时）
#
# 三者不一致的后果：
#   · 编译 25 + 运行 21 → UnsupportedClassVersionError（class file version 69.0）
#   · 编译 25 + jlink 21 → 打出的安装包装得进去却**启不了**（运行时不认 69 的字节码）
sundaysJdkVersion=25
