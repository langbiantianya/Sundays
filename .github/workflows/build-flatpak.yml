name: Flatpak 打包

# 与 Windows 那条腿一样：推 main / 打 tag / 手动触发。
# 刻意不在 pull_request 上跑 —— 这个仓库的 UI 测试依赖内网数据库（192.168.1.5）。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: flatpak-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # runtime 版本必须与 packaging/flatpak/*.json 里的 runtime-version 一致，
  # 两边漂移的话「装了运行时但 manifest 要的是另一个」会在构建中途才炸。
  # 下面有一道校验专门比对这两个值。
  FREEDESKTOP_RUNTIME: '24.08'

jobs:
  bundle:
    name: 打包 Flatpak ${{ matrix.flatpakArch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      # 与 Windows 腿同一个道理：arm64 的工具链更脆（多一层运行时下载、
      # 多一堆原生库），不让它取消掉已经打好的 amd64。
      fail-fast: false
      matrix:
        # 矩阵键不用连字符 —— matrix.foo-bar 会被 Actions 表达式解析成减法。
        include:
          - flatpakArch: amd64
            os: ubuntu-latest
            # readelf 对 ELF 的 Machine 字段：x86-64 是 "Advanced Micro Devices X86-64"，
            # arm64 是 "AArch64"。这里只取能区分两者的那个 token。
            elfMachine: X86-64
            # skiko 原生运行时包的 classifier 本身编码了目标平台：
            # linux-x64 / linux-arm64，两者互不为子串，判别干净。
            # ⚠️ Linux 的 arm64 产物叫 linux-arm64，不是 linux-aarch64 ——
            # Maven 的 osdetector 用 aarch64，skiko 自己发包时用 arm64，
            # 两套命名。首版按 aarch64 写，被自检当场拦下来了。
            skikoToken: x64
          - flatpakArch: arm64
            os: ubuntu-24.04-arm
            elfMachine: AArch64
            skikoToken: arm64

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------------
      # 仓库的 wrapper 指向腾讯云镜像，那是给国内开发机用的。
      # GitHub 托管的 runner 在境外，从那里拉一个 -all.zip（两百多 MB）既慢又不稳。
      # 只在 CI 里换回官方源，**不改仓库文件** —— 国内开发者照旧走镜像。
      - name: Gradle 分发源换回官方
        run: |
          sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v6
        with:
          # 与 Windows 腿保持一致：仓库里没有 jvmToolchain 声明，构建跟着
          # 跑它的 JDK 走，所以这里同时决定了字节码目标与 jlink 出来的运行时。
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # 先确认 runner 架构，别等到打包完了才发现跑错了机器。
      - name: 确认 runner 架构
        run: |
          echo "uname -m   = $(uname -m)"
          echo "runner.arch = ${{ runner.arch }}"
          echo "期望架构   = ${{ matrix.flatpakArch }}"

      # Compose 的 app-image 就是我们要的全部内容：jlink 出来的运行时 + 打平的 jar。
      # Linux 上同样有 skiko 的 linux-aarch_64 产物，所以这里不需要 Windows 腿
      # 那个「protoc 退回 x86_64」的绕法 —— osdetector 会自己挑 linux-aarch_64。
      # pipefail 必须显式开，否则构建失败会被 tee 吞成成功。
      - name: 打包应用
        run: |
          set -o pipefail
          ./gradlew :desktopApp:createDistributable --stacktrace 2>&1 | tee gradle-build.log

      # 用 `bash <脚本>` 而不是 `./<脚本>`：这个仓库主要在 Windows 上开发，
      # git 在那里通常不记录可执行位（core.fileMode=false），
      # 文件推上去是 100644，Linux runner 上直接 ./ 就会 Permission denied。
      # 显式交给 bash 解释器，这个依赖就消失了（脚本本身也用了 set -o pipefail，
      # 本来就必须由 bash 执行，不能用 sh）。
      - name: 组装 Flatpak 目录
        run: bash .github/scripts/assemble-flatpak-app.sh

      # 架构自检：在花时间下载 2GB 运行时之前，先确认打出来的确实是目标架构。
      #
      # 查两样，缺一不可：
      #   1. libjvm.so 的 ELF Machine —— 证明 **JDK** 是目标架构
      #   2. skiko-awt-runtime-*.jar 的名字 —— 证明 Compose 有没有按 os.arch
      #      选到对应的 native 库，而这才是这次 ARM 构建的核心风险点
      #
      # 第 2 条刻意看 **jar 名字而不是解出来的 .so**：那个 .so 是应用启动时
      # 才落地的，构建产物里未必有，Windows 腿上有是那边 jpackage 顺手放的，
      # 不能假定 Linux 也一样。而 classifier（linux-x64 / linux-arm64）
      # 是 Gradle 解析时确定下来的，板上钉钉。
      #
      # 全部用 find -name（按基名匹配）而非 -path：后者的通配符不跨 '/'，
      # 见 assemble-flatpak-app.sh 里踩过的坑。
      - name: 校验应用架构
        run: |
          ELF_MACHINE='${{ matrix.elfMachine }}'
          SKIKO_TOKEN='${{ matrix.skikoToken }}'
          STAGE=packaging/flatpak/sundays-app
          fail=0

          # 整棵 app-image 原样搬过来，所以运行时落在 lib/runtime 而不是 runtime。
          # 这里不加深度限制地全树找，省得跟着 jpackage 的目录约定反复改。
          jvm="$(find "$STAGE" -type f -name libjvm.so -print -quit 2>/dev/null || true)"
          if [ -z "$jvm" ]; then
            echo "::error::$STAGE 里找不到 libjvm.so，jlink 运行时没就位"
            fail=1
          else
            m="$(readelf -h "$jvm" | sed -n 's/.*Machine: *//p' | head -n1)"
            echo "libjvm.so Machine = $m（期望含 $ELF_MACHINE）"
            case "$m" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error::运行时架构不对：实际 $m，期望含 $ELF_MACHINE"; fail=1 ;;
            esac
          fi

          # 原生启动器也验一下：它是 ELF 可执行文件，架构错了同样启动不了。
          launcher="$(find "$STAGE/bin" -maxdepth 1 -type f -print -quit 2>/dev/null || true)"
          if [ -z "$launcher" ]; then
            echo "::error::$STAGE/bin 下没有原生启动器"
            fail=1
          else
            lm="$(readelf -h "$launcher" | sed -n 's/.*Machine: *//p' | head -n1)"
            echo "原生启动器 $(basename "$launcher") Machine = $lm（期望含 $ELF_MACHINE）"
            case "$lm" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error::启动器架构不对：实际 $lm，期望含 $ELF_MACHINE"; fail=1 ;;
            esac
          fi

          skiko="$(find "$STAGE" -type f -name 'skiko-awt-runtime-*.jar' -print -quit 2>/dev/null || true)"
          if [ -z "$skiko" ]; then
            echo "::error::$STAGE 里找不到 skiko-awt-runtime-*.jar"
            fail=1
          else
            base="$(basename "$skiko")"
            echo "skiko 原生运行时包 = $base（期望含 $SKIKO_TOKEN）"
            case "$base" in
              *"$SKIKO_TOKEN"*) ;;
              *) echo "::error::skiko 选错了平台：$base，期望含 $SKIKO_TOKEN"; fail=1 ;;
            esac
          fi

          exit $fail

      # ---------------------------------------------------------------------------
      # manifest 里的 runtime-version 与 env 里那个必须一致，否则会出现
      # 「装了 24.08 的运行时，manifest 却在要 26.08」这种中途才炸的错。
      - name: 校验 runtime 版本与 manifest 一致
        run: |
          in_manifest="$(sed -n 's/.*"runtime-version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            packaging/flatpak/com.kxxnzstdsw.sundays.json | head -n1)"
          echo "env      = $FREEDESKTOP_RUNTIME"
          echo "manifest = $in_manifest"
          if [ "$in_manifest" != "$FREEDESKTOP_RUNTIME" ]; then
            echo "::error::runtime 版本不一致：env 是 $FREEDESKTOP_RUNTIME，manifest 是 $in_manifest"
            exit 1
          fi

      - name: 安装 flatpak 工具
        run: |
          sudo apt-get update
          # elfutils 不能省。flatpak-builder 1.x 剥离 debuginfo 时调的是 eu-strip，
          # 压缩时调 eu-elfcompress，这两个都在 elfutils 包里。缺了不会在安装时
          # 报错，而是等模块都装好了才炸：
          #   Failed to execute child process "eu-strip" (No such file or directory)
          # 属于「前面全绿、最后一步才崩」的那类，装完立刻点名确认。
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree elfutils
          for b in flatpak flatpak-builder ostree eu-strip eu-elfcompress; do
            if ! command -v "$b" >/dev/null 2>&1; then
              echo "::error::$b 没装上"
            fi
          done
          echo "::warning::工具就位：$(command -v eu-strip eu-elfcompress | tr '\n' ' ')"

      # 列出远端到底有哪些 freedesktop 运行时。这不是装饰：arm64 上某个
      # 分支缺某个 ref 时，flatpak install 会在几秒内直接失败，而那几秒的
      # 步骤日志在匿名视角下看不到。把 ref 列表打成 warning，谁缺一目了然。
      # continue-on-error：这个查询本身失败不该拖垮构建。
      - name: 查远端可用的 freedesktop 运行时
        continue-on-error: true
        run: |
          flatpak remote-ls flathub --runtime --columns=ref 2>/dev/null \
            | grep -E '^org\.freedesktop\.(Platform|Sdk|Platform\.GL|Platform\.Vulkan)//' \
            | sort | tail -n 24 \
            | while IFS= read -r ref; do echo "::warning::远端有 $ref"; done

      # 运行时与 SDK 有两个多 G，是整个流程里最慢的一步，放在组装之后。
      # --disable-rofiles-fuse：CI 上没有 fuse daemon，用不了 rofiles-fuse
      # 那个更快的 checkout 路径，退回普通方式即可，只是慢一点。
      #
      # 只装 Platform 与 Sdk，不装 Platform.GL / Platform.Vulkan：
      # 自 23.08 起 GL/EGL/Mesa 已经并进主运行时，那两个扩展是给老应用留的
      # 兼容件。本应用不需要它们，装上只是平白多两个可能不存在的 ref ——
      # 上一轮就是这一步在两条腿上失败的。
      - name: 安装 freedesktop 运行时与 SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak install --user -y --noninteractive flathub \
              "org.freedesktop.Platform//$FREEDESKTOP_RUNTIME" \
              "org.freedesktop.Sdk//$FREEDESKTOP_RUNTIME" 2>&1 | tee runtime-install.log; then
            echo "::error::freedesktop $FREEDESKTOP_RUNTIME 运行时/SDK 安装失败，末尾输出："
            tail -n 8 runtime-install.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          flatpak list --user --columns=ref

      # 这一步全程自报现场。上一轮它「成功」了却什么也没留下：repo 不存在、
      # files/ 是空的、耗时不到 1 秒。成功却没产物，是最难受的一种失败 ——
      # 猜测空间太大，所以把版本号、完整输出、三处目录内容全打成 annotation。
      #
      # 关键：**站在 manifest 所在目录里调用 flatpak-builder**。
      # sources 里的相对路径到底按「manifest 所在目录」还是按「当前工作目录」
      # 解析，各版本说法不一；从仓库根调用时 dir source 没被放进模块构建目录，
      # 于是 cp: cannot stat 'sundays-app'。站到同一个目录里，两种解释结果
      # 必然相同，就不必赌。输出目录仍指回工作区根。
      - name: 构建 Flatpak
        run: |
          set +e
          echo "::warning::flatpak-builder = $(command -v flatpak-builder)；版本 $(flatpak-builder --version 2>&1)"
          cd packaging/flatpak
          # 预检：manifest 的 command 必须能在组装产物里找到对应文件。
          # command 是相对 /app 的，而应用被装在 /app/<dest> 下，所以比对前要
          # 剥掉 dest 这一段 —— sundays-app/bin/... 对上的才是
          # sundays/bin/...，不是 sundays-app/sundays/bin/...
          # dest 从 manifest 自己的 build-commands 里推导，不在这里重复写死。
          cmd="$(sed -n 's/.*"command"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                 com.kxxnzstdsw.sundays.json | head -n1)"
          dest="$(grep -o 'files/[a-z0-9_-]*/' com.kxxnzstdsw.sundays.json | head -n1 \
                 | sed 's|^files/||; s|/$||')"
          rel="$cmd"
          if [ -n "$dest" ]; then
            case "$cmd" in
              "$dest"/*) rel="${cmd#"$dest"/}" ;;
              *)
                echo "::error::command=$cmd 没有以安装目录 $dest/ 开头 —— 应用装在 /app/$dest 下，command 必须带上这一层"
                echo "::error::组装产物顶层：$(ls -A sundays-app 2>&1 | tr '\n' ' ')"
                exit 1
                ;;
            esac
          fi
          echo "::warning::command=$cmd，安装目录=/app/$dest，对应组装产物 sundays-app/$rel"
          if [ ! -e "sundays-app/$rel" ]; then
            echo "::error::command=$cmd 在组装产物里没有对应文件（期望 sundays-app/$rel）"
            echo "::error::组装产物顶层：$(ls -A sundays-app 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "::warning::command 与组装产物对得上"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo="$GITHUB_WORKSPACE/flatpak-repo" \
            "$GITHUB_WORKSPACE/flatpak-build" \
            com.kxxnzstdsw.sundays.json > "$GITHUB_WORKSPACE/builder.log" 2>&1
          rc=$?
          cd "$GITHUB_WORKSPACE"
          echo "::warning::flatpak-builder 退出码 = $rc"
          # 只取日志**末尾** 9 行，且必须放在最前面发。
          # GitHub 每个步骤只保留**前 10 条** workflow-command annotation —— 上一轮
          # 把整份日志逐行 dump，结果真正那句错误排在第 13、14 行，直接被丢掉了，
          # 看到的 10 条全是开头的 banner。同理别指望把几十行日志全搬过来。
          tail -n 9 builder.log | while IFS= read -r line; do echo "::error::$line"; done
          echo "::warning::工作区顶层：$(ls -A | tr '\n' ' ')"
          echo "::warning::flatpak-build 顶层：$(ls -A flatpak-build 2>&1 | tr '\n' ' ')"
          echo "::warning::flatpak-build/files：$(ls -A flatpak-build/files 2>&1 | head -c 500)"
          echo "::warning::flatpak-repo 顶层：$(ls -A flatpak-repo 2>&1 | tr '\n' ' ')"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ ! -d flatpak-build/files/sundays ]; then
            echo "::error::退出码 0 但 files/sundays 不存在 —— build-commands 没生效，别当成构建成功"
            exit 1
          fi
          echo "::warning::应用目录体积：$(du -sh flatpak-build/files/sundays | cut -f1)"

      # 导出成单文件 bundle：既是可直接安装的产物，也顺带包含了整棵依赖树，
      # 用户不必再单独解决 org.freedesktop.Platform 的安装问题。
      #
      # 分支不写死。flatpak-builder 往 repo 里导出的默认分支是 master，
      # 首版这里写的是 stable，于是去要一个不存在的 ref。这里改成先读 repo
      # 里真实存在的 ref 再取分支，以后 flatpak-builder 改默认值也不会带崩。
      - name: 导出单文件 bundle
        run: |
          set +e
          ostree --repo=flatpak-repo refs > repo-refs.txt 2>&1
          sed 's/^/::warning::repo ref: /' repo-refs.txt
          ref="$(grep '^app/com\.kxxnzstdsw\.sundays/' repo-refs.txt | head -n1)"
          if [ -z "$ref" ]; then
            echo "::error::repo 里没有 app/com.kxxnzstdsw.sundays 的 ref —— flatpak-builder 那步多半没真导出"
            echo "::error::repo 目录内容：$(ls -A flatpak-repo 2>&1 | tr '\n' ' ')"
            echo "::error::构建目录内容：$(ls -A flatpak-build/files 2>&1 | head -c 400)"
            exit 1
          fi
          branch="${ref#app/com.kxxnzstdsw.sundays/}"
          echo "::warning::用分支 $branch 导出"
          flatpak build-bundle flatpak-repo \
            "sundays-flatpak-${{ matrix.flatpakArch }}.flatpak" \
            com.kxxnzstdsw.sundays "$branch" > bundle.log 2>&1
          rc=$?
          # 同样只取末尾 9 行，理由见「构建 Flatpak」那步的注释。
          tail -n 9 bundle.log | while IFS= read -r line; do echo "::error::$line"; done
          echo "::warning::build-bundle 退出码 = $rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ls -lh *.flatpak

      - uses: actions/upload-artifact@v7
        with:
          name: sundays-flatpak-${{ matrix.flatpakArch }}
          path: sundays-flatpak-${{ matrix.flatpakArch }}.flatpak
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------------
      # 失败原因转 annotation：GitHub 网页版会把大步骤日志整个截断，
      # 原始日志下载要仓库权限，结果就是 CI 一红没人看得到报错原文。
      # annotation 走 /check-runs/{id}/annotations，公开可读且不受步骤大小限制。
      - name: 失败原因（匿名可读）
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then
            echo "::error::没有 gradle-build.log；失败发生在 Gradle 之外（见上方步骤）"
            exit 0
          fi
          block="$(sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log)"
          if [ -z "$block" ]; then
            block="$(tail -n 20 gradle-build.log)"
          fi
          echo "$block"
          # 只捞真正的报错行。早先这里把 '^>' 也当关键词，于是 `> Task :xxx` 这种
          # 普通控制台进度行被当成报错刷了八条，annotation 全是噪音，
          # 反而把真正那句错误淹掉了 —— 排查时先被这些带偏。
          printf '%s\n' "$block" \
            | grep -vE '^> Task |^$' \
            | grep -E 'Caused by|Exception|error|Error|FAILURE|cannot|Could not|failed' \
            | tail -n 8 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done
