name: Flatpak 打包

# 与 Windows 那条腿一样：推 main / 打 tag / 手动触发。
# 刻意不在 pull_request 上跑 —— 这个仓库的 UI 测试依赖内网数据库（192.168.1.5）。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: flatpak-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---------------------------------------------------------------------------
  # 运行时与 SDK 已从 freedesktop 换成 GNOME 51。
  #
  # GNOME 51 架在 freedesktop 26.08 基线上 —— 实测 `flatpak install flathub
  # org.gnome.Platform//51` 连带拉下来的正是 org.freedesktop.Platform.GL.default 26.08、
  # VAAPI.Intel 26.08、codecs-extra 26.08-extra，分支号就是基线版本号。
  #
  # 下面这两个值必须分开记，因为它们回答的是两个不同的问题：
  #   GNOME_RUNTIME       —— runtime / sdk 用哪一代（org.gnome.*//51）
  #   FREEDESKTOP_BRANCH  —— 底下那层 freedesktop 基线（26.08）
  #
  # FREEDESKTOP_BRANCH 只用在**安装**那一步：org.freedesktop.Sdk.Extension.openjdk
  # 装在 //26.08 这条基线分支上。它**不进 manifest** —— manifest 的
  # sdk-extensions 里只能写裸名，写成 //26.08 会被 flatpak build-init 判成
  # 「没装这个扩展」，理由见「校验 manifest 与 env 一致」那步的注释。
  # 换句话说：基线决定装哪个 ref，manifest 不参与这个决定。
  GNOME_RUNTIME: '51'
  FREEDESKTOP_BRANCH: '26.08'

jobs:
  bundle:
    name: 打包 Flatpak ${{ matrix.flatpakArch }}
    runs-on: ${{ matrix.os }}
    # GNOME SDK 比 freedesktop SDK 更大（多整层 GNOME 平台），
    # 光「装运行时与 SDK」那一步就要拉两个多 G，所以比原来宽裕一些。
    timeout-minutes: 90

    strategy:
      # 与 Windows 腿同一个道理：arm64 的工具链更脆（多一层运行时下载、
      # 多一堆原生库），不让它取消掉已经打好的 amd64。
      fail-fast: false
      matrix:
        # 矩阵键不用连字符 —— matrix.foo-bar 会被 Actions 表达式解析成减法。
        include:
          - flatpakArch: amd64
            os: ubuntu-latest
            # 直接对 ELF 头里 e_machine 字段的字面值（偏移 0x12，小端 2 字节），
            # 而不是 readelf 打印的 Machine 字符串。字符串得再解析一层，
            # 字面值不用 —— 0x3E 是 x86-64，0xB7 是 AArch64。
            elfEmachine: '0x3E'
            # skiko 原生运行时包的 classifier 本身编码了目标平台：
            # linux-x64 / linux-arm64，两者互不为子串，判别干净。
            # ⚠️ Linux 的 arm64 产物叫 linux-arm64，不是 linux-aarch64 ——
            # Maven 的 osdetector 用 aarch64，skiko 自己发包时用 arm64，
            # 两套命名。首版按 aarch64 写，被自检当场拦下来了。
            skikoToken: x64
            # Flatpak 自己用的 CPU 名：amd64 在 Flatpak 这边叫 x86_64，
            # arm64 叫 aarch64。app 目录的 metadata 里 runtime=/sdk= 写的是它，
            # 构建完要按它逐字比对，所以单列一项，别拿 matrix.flatpakArch 顶替。
            flatpakCpu: x86_64
          - flatpakArch: arm64
            os: ubuntu-24.04-arm
            elfEmachine: '0xB7'
            skikoToken: arm64
            flatpakCpu: aarch64

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------------
      # 仓库的 wrapper 指向腾讯云镜像，那是给国内开发机用的。
      # GitHub 托管的 runner 在境外，从那里拉一个 -all.zip（两百多 MB）既慢又不稳。
      # 只在 CI 里换回官方源，**不改仓库文件** —— 国内开发者照旧走镜像。
      - name: Gradle 分发源换回官方
        run: |
          sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v6
        with:
          # 与 Windows 腿保持一致：仓库里没有 jvmToolchain 声明，构建跟着
          # 跑它的 JDK 走，所以这里同时决定了字节码目标与 jlink 出来的运行时。
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # 先确认 runner 架构，别等到打包完了才发现跑错了机器。
      - name: 确认 runner 架构
        run: |
          echo "uname -m   = $(uname -m)"
          echo "runner.arch = ${{ runner.arch }}"
          echo "期望架构   = ${{ matrix.flatpakArch }}"

      # Compose 的 app-image 只用来取「打平的 jar + 资源」，jlink 出来的那份运行时
      # 会被组装脚本丢掉 —— JDK 改由 Freedesktop 的 OpenJDK 扩展提供。
      # Linux 上同样有 skiko 的 linux-aarch_64 产物，所以这里不需要 Windows 腿
      # 那个「protoc 退回 x86_64」的绕法 —— osdetector 会自己挑 linux-aarch_64。
      # pipefail 必须显式开，否则构建失败会被 tee 吞成成功。
      - name: 打包应用
        run: |
          set -o pipefail
          ./gradlew :desktopApp:createDistributable --stacktrace 2>&1 | tee gradle-build.log

      # 用 `bash <脚本>` 而不是 `./<脚本>`：这个仓库主要在 Windows 上开发，
      # git 在那里通常不记录可执行位（core.fileMode=false），
      # 文件推上去是 100644，Linux runner 上直接 ./ 就会 Permission denied。
      # 显式交给 bash 解释器，这个依赖就消失了（脚本本身也用了 set -o pipefail，
      # 本来就必须由 bash 执行，不能用 sh）。
      - name: 组装 Flatpak 目录
        run: bash .github/scripts/assemble-flatpak-app.sh

      # 架构自检：在花时间下载 2GB 运行时之前，先确认打出来的确实是目标架构。
      #
      # 自从不再自带 jlink JDK 之后，包里唯一与架构强相关的东西就只剩 skiko 的
      # 原生库了。所以原来查 libjvm.so 与原生启动器两条都删掉 —— 那两个文件现在
      # 根本不存在，留着只会让这道自检永远红。
      #
      # 全部用 find -name（按基名匹配）而非 -path：后者的通配符不跨 '/'，
      # 见 assemble-flatpak-app.sh 里踩过的坑。
      - name: 校验应用架构
        run: |
          ELF_MACHINE='${{ matrix.elfEmachine }}'
          SKIKO_TOKEN='${{ matrix.skikoToken }}'
          STAGE=packaging/flatpak/sundays-app
          fail=0

          # 先确认组装产物是新布局：只有 jar、资源和一个 shell 启动器，
          # 不该再有 jlink 出来的 runtime 目录。布局没切过来就往下跑，
          # 等于在给一份没人验证过的目录树打包。
          if find "$STAGE" -type d -name runtime -print -quit 2>/dev/null | grep -q .; then
            echo "::error::$STAGE 里还有 runtime 目录 —— jlink 运行时不该被搬进来"
            fail=1
          fi
          jars="$(find "$STAGE" -type f -name '*.jar' | wc -l | tr -d ' ')"
          echo "组装产物 jar 数 = $jars"
          if [ "$jars" -lt 50 ]; then
            echo "::error::组装产物只有 $jars 个 jar，app-image 多半没找对"
            fail=1
          fi

          # 启动器现在是 /bin/sh 脚本，不再是 ELF 可执行文件，只查存在且可执行。
          launcher="$STAGE/bin/com.kxxnzstdsw.sundays"
          if [ ! -x "$launcher" ]; then
            echo "::error::$launcher 不存在或不可执行"
            fail=1
          else
            echo "启动器 = $launcher"
          fi

          skiko="$(find "$STAGE" -type f -name 'skiko-awt-runtime-*.jar' -print -quit 2>/dev/null || true)"
          if [ -z "$skiko" ]; then
            echo "::error::$STAGE 里找不到 skiko-awt-runtime-*.jar"
            fail=1
          else
            base="$(basename "$skiko")"
            echo "skiko 原生运行时包 = $base（期望含 $SKIKO_TOKEN）"
            case "$base" in
              *"$SKIKO_TOKEN"*) ;;
              *) echo "::error::skiko 选错了平台：$base，期望含 $SKIKO_TOKEN"; fail=1 ;;
            esac
          fi

          # 原生库是**并排的普通文件**，不是 jar 里的条目。
          # 这点上一版想当然搞错了：以为 skiko-awt-runtime-*.jar 里内嵌 .so，
          # 结果解出来一个都没有，两条腿一起红。原因值得记：
          # Compose 的 Gradle 插件会**合成**一个 skiko-awt-runtime-<平台>-<版本>.jar，
          # 那个 jar 只有 2 个条目（实测本机 Windows 产物：293 字节、2 条），
          # 真正的库是它从 skiko 发行物里解出来、并排放在 app 目录下的
          # skiko-<平台>.dll / libskiko-<平台>.so。
          # 所以 classifier 检查的是文件名，证明 Gradle 选对了平台；
          # 架构检查要读那个并排文件的字节。
          so="$(find "$STAGE" -type f -name '*.so' -print -quit 2>/dev/null || true)"
          if [ -z "$so" ]; then
            echo "::error::$STAGE 里找不到 .so —— skiko 的原生库没跟着 app-image 进来"
            echo "::error::非 jar 的文件：$(find "$STAGE" -type f ! -name '*.jar' ! -name '*.cfg' | head -c 300 | tr '\n' ' ')"
            fail=1
          elif ! command -v python3 >/dev/null 2>&1; then
            echo "::warning::runner 上没有 python3，跳过 ELF 复核（只剩 classifier 一道）"
          else
            # ELF 头 e_machine 在偏移 0x12，小端 2 字节：0x3E=x86-64，0xB7=AArch64。
            # 连 \x7fELF 魔数一起验，免得读到一个名字像 .so 的非 ELF 文件还照报架构。
            m="$(python3 -c 'import sys,struct; d=open(sys.argv[1],"rb").read(20); print("NOT_ELF" if len(d)<20 or d[:4]!=b"\x7fELF" else "0x%02X" % struct.unpack_from("<H",d,18)[0])' "$so" 2>&1)"
            echo "原生库 ${so##*/} 的 ELF e_machine = $m（期望 $ELF_MACHINE）"
            if [ "$m" != "$ELF_MACHINE" ]; then
              echo "::error::skiko 原生库架构不对：e_machine=$m，期望 $ELF_MACHINE"
              fail=1
            fi
          fi

          exit $fail

      # ---------------------------------------------------------------------------
      # manifest 里的 runtime / runtime-version / sdk / sdk-extensions
      # 必须与 env 里那两个值对得上，否则会出现「装了 GNOME 51，manifest 却在要
      # freedesktop 26.08」这种中途才炸的错。
      #
      # 拆成四条而不是一次性比一串，是因为这四个字段各自会独立地错一次：
      # 最容易出的不是版本号写错，而是只改了 runtime-version 忘了改 sdk-extensions
      # 里的 //26.08 —— 那一条只有单独比才看得出来。
      #
      # **先把 `"//"` 那一整行注释滤掉再取值。** 这是本地实跑抓到的真 bug：
      # manifest 开头那段长注释里同样写着 `openjdk//26.08`，而取值用的
      # `head -n1` 取的是**第一个**匹配，于是把注释里那半句一起读了出来 ——
      # 分支被读成「26.08；只写裸名字会被 flatpak-builder 按 SDK 的分支解析成」。
      # 注释写给谁看不会影响它也被 grep 到，这跟它是不是「内容」无关。
      - name: 校验 manifest 与 env 一致
        run: |
          set -u
          M=packaging/flatpak/com.kxxnzstdsw.sundays.json
          flat() { sed '/^[[:space:]]*"\/\/":/d' "$M"; }
          pick() { flat | sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -n1; }
          fail=0
          chk() {
            if [ "$2" = "$3" ]; then
              echo "::warning::$1 = $2"
            else
              echo "::error::$1：env 期望 $2，manifest 是 $3"
              fail=1
            fi
          }
          chk runtime        org.gnome.Platform "$(pick runtime)"
          chk runtime-version "$GNOME_RUNTIME"    "$(pick runtime-version)"
          chk sdk            org.gnome.Sdk       "$(pick sdk)"

          # sdk-extensions 单独比，且单独判「有没有多写 //分支」这一种错法 ——
          # 它是本仓库真踩过的坑，而且错法只有一种。
          #
          # flatpak build-init 的 ensure_extensions() 只调 flatpak_parse_extension_with_tag()
          # 剥 @tag，**不解析 //分支**，然后拿整串去跟 SDK metadata 里声明的扩展点
          # id 比。所以 org.freedesktop.Sdk.Extension.openjdk//26.08 永远匹配不上，
          # 而且报错会把整串再拼上 <arch>/<SDK 的分支>，变成一句看着像路径拼接错了的
          # 「...openjdk//26.08/x86_64/51 not installed」。
          #
          # 扩展装在哪个分支跟 manifest 无关，是 flatpak install 时的事，交给下面
          # 「安装 GNOME 运行时与 SDK」那步装完点名核对。
          ext="$(flat | tr -d '\n' \
            | sed -n 's#.*"sdk-extensions"[[:space:]]*:[[:space:]]*\[\([^]]*\)\].*#\1#p' \
            | tr -d '[:space:]"')"
          if [ "$ext" = org.freedesktop.Sdk.Extension.openjdk ]; then
            echo "::warning::sdk-extensions = $ext"
          else
            case "$ext" in
              *//*) echo "::error::sdk-extensions=$ext 带了 //分支，flatpak build-init 不认这种写法" ;;
              *)    echo "::error::sdk-extensions 期望 org.freedesktop.Sdk.Extension.openjdk，实际 $ext" ;;
            esac
            fail=1
          fi
          exit $fail

      - name: 安装 flatpak 工具
        run: |
          sudo apt-get update
          # elfutils 不能省。flatpak-builder 1.x 剥离 debuginfo 时调的是 eu-strip，
          # 压缩时调 eu-elfcompress，这两个都在 elfutils 包里。缺了不会在安装时
          # 报错，而是等模块都装好了才炸：
          #   Failed to execute child process "eu-strip" (No such file or directory)
          # 属于「前面全绿、最后一步才崩」的那类，装完立刻点名确认。
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree elfutils
          for b in flatpak flatpak-builder ostree eu-strip eu-elfcompress; do
            if ! command -v "$b" >/dev/null 2>&1; then
              echo "::error::$b 没装上"
            fi
          done
          echo "::warning::工具就位：$(command -v eu-strip eu-elfcompress | tr '\n' ' ')"

      # 点名每个 ref 在远端到底存不存在。这不是装饰：缺 ref 时 flatpak install
      # 会在几秒内直接失败，而那几秒的步骤日志在匿名视角下看不到。
      # continue-on-error：这个查询本身失败不该拖垮构建。
      #
      # 远端必须先在这里加上。上一版这个检查排在「安装 flatpak 工具」之后、
      # 「安装运行时与 SDK」之前，于是查的时候 flathub 这个 remote 还不存在，
      # 三个 ref 全报「远端没有」—— 一个百分之百的假阴性，而且带着 error 级别，
      # 差点被当成真结论。remote-add 是幂等的（--if-not-exists），提前加无害。
      #
      # Locale 与 GL.default 查得到即可、**不需要装**（理由见下面 install 那步）：
      # 查它们只为把「这个基线上 GNOME 侧没发布某某扩展」变成一句几秒内可见的报错，
      # 而不是等用户装完、开始菜单点不动才发现少了东西。
      #
      # 用 remote-info 而不是 `remote-ls --columns=ref | grep`：
      # 后者的 ref 列打的是带 runtime/ 前缀的完整 ref
      # （runtime/org.freedesktop.Sdk/x86_64/26.08），行首锚 org\.freedesktop\.
      # 一条都匹配不到，那步从加进来起就一直空转，却一直被当成「ref 列表已经
      # 打出来了」。remote-info 是二元答案，不依赖输出格式。
      - name: 查远端可用的运行时 ref
        continue-on-error: true
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          for r in "org.gnome.Platform//$GNOME_RUNTIME" \
                   "org.gnome.Sdk//$GNOME_RUNTIME" \
                   "org.gnome.Platform.Locale//$GNOME_RUNTIME" \
                   "org.freedesktop.Platform.GL.default//$FREEDESKTOP_BRANCH" \
                   "org.freedesktop.Sdk.Extension.openjdk//$FREEDESKTOP_BRANCH"; do
            if flatpak remote-info --user flathub "$r" >/dev/null 2>&1; then
              echo "::warning::远端有 $r"
            else
              echo "::error::远端没有 $r"
            fi
          done

      # 运行时与 SDK 有两个多 G，是整个流程里最慢的一步，放在组装之后。
      # --disable-rofiles-fuse：CI 上没有 fuse daemon，用不了 rofiles-fuse
      # 那个更快的 checkout 路径，退回普通方式即可，只是慢一点。
      #
      # 装的是 org.gnome.Platform//51 与 org.gnome.Sdk//51 —— GNOME 运行时本身
      # 就是 freedesktop Platform/Sdk 的一层扩展，装它会把底下那层基线一并带下来，
      # 所以**不需要**再单独装 org.freedesktop.Platform / Sdk。
      #
      # **分支跟 manifest 无关，manifest 里写的是裸名。** 扩展装在哪条分支上是
      # 这一步的事：GNOME 51 的基线是 26.08，所以装 //26.08 那个 ref。
      # manifest 那边写 `//26.08` 反而会挂 —— flatpak build-init 的
      # ensure_extensions() 不解析 `//分支`。
      #
      # 也**不装** Platform.GL / Platform.Vulkan / GL.default：
      # 自 23.08 起 GL/EGL/Mesa 已经并进主运行时，这些是给老应用留的兼容件，
      # 装上只是平白多几个可能不存在的 ref —— 上一轮就是这一步在两条腿上失败的。
      - name: 安装 GNOME 运行时与 SDK
        run: |
          # pipefail 必须显式开。没写 shell: 的步骤用的是 GitHub 的默认 shell
          # `bash -e {0}`，**没有 pipefail**：管道里 flatpak install 挂了会被
          # tee 吃掉退出码，步骤照样判绿。而后面 flatpak-builder 只会说
          # 「Requested extension ... not installed」—— 把「装失败」说成
          # 「没装」，方向完全相反。诊断步骤自己绝不能成为失败原因。
          set -o pipefail
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak install --user -y --noninteractive flathub \
              "org.gnome.Platform//$GNOME_RUNTIME" \
              "org.gnome.Sdk//$GNOME_RUNTIME" \
              "org.freedesktop.Sdk.Extension.openjdk//$FREEDESKTOP_BRANCH" 2>&1 | tee runtime-install.log; then
            echo "::error::GNOME $GNOME_RUNTIME 运行时/SDK 安装失败，末尾输出："
            tail -n 8 runtime-install.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

          # 装没装上要**点名核对**，不能等 flatpak-builder 报「not installed」
          # 才发现 —— 那句话只说「没装」，不说「装失败」，两者排查方向不同。
          flatpak list --user --columns=ref > installed-refs.txt
          cat installed-refs.txt
          CPU='${{ matrix.flatpakCpu }}'
          for r in "runtime/org.gnome.Platform/$CPU/$GNOME_RUNTIME" \
                   "runtime/org.gnome.Sdk/$CPU/$GNOME_RUNTIME" \
                   "runtime/org.freedesktop.Sdk.Extension.openjdk/$CPU/$FREEDESKTOP_BRANCH"; do
            if grep -qx "$r" installed-refs.txt; then
              echo "::warning::已装 $r"
            else
              echo "::error::没装上 $r"
              exit 1
            fi
          done

      # 这一步全程自报现场。上一轮它「成功」了却什么也没留下：repo 不存在、
      # files/ 是空的、耗时不到 1 秒。成功却没产物，是最难受的一种失败 ——
      # 猜测空间太大，所以把版本号、完整输出、三处目录内容全打成 annotation。
      #
      # 关键：**站在 manifest 所在目录里调用 flatpak-builder**。
      # sources 里的相对路径到底按「manifest 所在目录」还是按「当前工作目录」
      # 解析，各版本说法不一；从仓库根调用时 dir source 没被放进模块构建目录，
      # 于是 cp: cannot stat 'sundays-app'。站到同一个目录里，两种解释结果
      # 必然相同，就不必赌。输出目录仍指回工作区根。
      - name: 构建 Flatpak
        run: |
          set +e
          echo "::warning::flatpak-builder = $(command -v flatpak-builder)；版本 $(flatpak-builder --version 2>&1)"
          cd packaging/flatpak
          # 预检：把 flatpak-builder 的 command 解析规则原样搬过来，提前拦下
          # 拼错的情况 —— 它要跑到收尾才报错，而那之前十几步全绿。
          # 规则见 builder-manifest.c：
          #   以 /app/ 开头  → files/<去掉 /app/ 的部分>
          #   相对且带 '/'   → files/bin/<整串>（整串当文件名挂到 bin 下）
          #   相对裸文件名   → files/bin/<该文件名>
          cmd="$(sed -n 's/.*"command"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                 com.kxxnzstdsw.sundays.json | head -n1)"
          case "$cmd" in
            /*) rel="${cmd#/app/}" ;;
            */*)
              echo "::error::command=$cmd 是带路径的相对写法 —— flatpak-builder 会把整串当文件名挂到 files/bin/ 下（即 files/bin/$cmd），请写成 /app/$cmd"
              exit 1
              ;;
            *) rel="bin/$cmd" ;;
          esac
          echo "::warning::command=$cmd，实际找 files/$rel，对应组装产物 sundays-app/$rel"
          if [ ! -e "sundays-app/$rel" ]; then
            echo "::error::command=$cmd 在组装产物里没有对应文件（期望 sundays-app/$rel）"
            echo "::error::组装产物顶层：$(ls -A sundays-app 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "::warning::command 与组装产物对得上"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo="$GITHUB_WORKSPACE/flatpak-repo" \
            "$GITHUB_WORKSPACE/flatpak-build" \
            com.kxxnzstdsw.sundays.json > "$GITHUB_WORKSPACE/builder.log" 2>&1
          rc=$?
          cd "$GITHUB_WORKSPACE"
          echo "::warning::flatpak-builder 退出码 = $rc"
          # 按内容 grep，而不是 tail。GitHub 每步骤只保留前 10 条 annotation，
          # tail 会随 flatpak-builder 日志变长而漂移 —— 上轮就因为 debuginfo
          # 剥离的输出挤在后面，把真正想看的行顶出去了。按关键词捞则不受位置影响。
          grep -E 'CHK|Error|error:|Command|not found|No such' builder.log \
            | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::warning::工作区顶层：$(ls -A | tr '\n' ' ')"
          echo "::warning::flatpak-build 顶层：$(ls -A flatpak-build 2>&1 | tr '\n' ' ')"
          echo "::warning::flatpak-build/files：$(ls -A flatpak-build/files 2>&1 | head -c 500)"
          echo "::warning::flatpak-repo 顶层：$(ls -A flatpak-repo 2>&1 | tr '\n' ' ')"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          # 「成功却没产物」这道断言留着，但断言点必须跟着 manifest 走 ——
          # 上一版它写死了 files/sundays，那还是几轮前嵌套布局时的路径，
          # 应用改到 /app 根之后它就一直误报，把已经成功的构建判成失败。
          built="$(sed -n 's/.*"command"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                  packaging/flatpak/com.kxxnzstdsw.sundays.json | head -n1)"
          built="${built#/app/}"
          if [ ! -e "flatpak-build/files/$built" ]; then
            echo "::error::退出码 0 但 flatpak-build/files/$built 不存在 —— 产物没落到应用目录"
            echo "::error::files 顶层：$(ls -A flatpak-build/files 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "::warning::产物就位：flatpak-build/files/$built（$(du -sh flatpak-build/files | cut -f1)）"

          # JDK 来自 OpenJDK 扩展的 install.sh，落在 /app/jre。
          # 单独验它：manifest 里那步 test -x 只保证构建沙箱里能跑，
          # 真正要确认的是它进了应用目录 —— 否则用户点开始菜单时
          # 启动器只会打一句「找不到可用的 java」然后退出 127。
          if [ ! -x flatpak-build/files/jre/bin/java ]; then
            echo "::error::应用目录里没有 jre/bin/java —— OpenJDK 扩展没装进来"
            echo "::error://app 顶层：$(ls -A flatpak-build/files 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "::warning::应用内 JDK：flatpak-build/files/jre/bin/java"

          # 最后验一次**导出的 metadata 到底指向哪个运行时**。
          # 这一条不能省：「换了运行时」是一类特别容易被自己骗过去的改动 ——
          # 构建全绿、bundle 也导出来了，看上去什么都没问题，但 metadata 里
          # 的 runtime= 仍旧是上一代的话，装到用户机器上的还是旧运行时，
          # 而本地和 CI 都永远看不出来。flatpak-builder 把应用元数据写在
          # <build-dir>/metadata，正是要交给 flatpak build-bundle 用的那一份。
          if [ ! -f flatpak-build/metadata ]; then
            echo "::error::flatpak-build/metadata 不存在 —— 断言点没了，先看 flatpak-build 顶层"
            exit 1
          fi
          want_rt="org.gnome.Platform/${{ matrix.flatpakCpu }}/$GNOME_RUNTIME"
          want_sdk="org.gnome.Sdk/${{ matrix.flatpakCpu }}/$GNOME_RUNTIME"
          got_rt="$(sed -n 's/^runtime=//p' flatpak-build/metadata | head -n1)"
          got_sdk="$(sed -n 's/^sdk=//p' flatpak-build/metadata | head -n1)"
          echo "::warning::metadata runtime=$got_rt sdk=$got_sdk"
          if [ "$got_rt" != "$want_rt" ]; then
            echo "::error::导出的 runtime 是 $got_rt，期望 $want_rt"
            exit 1
          fi
          if [ "$got_sdk" != "$want_sdk" ]; then
            echo "::error::导出的 sdk 是 $got_sdk，期望 $want_sdk"
            exit 1
          fi
          echo "::warning::metadata 指向 GNOME $GNOME_RUNTIME，对得上"

      # 导出成单文件 bundle。
      #
      # 分支不写死，也不整段截取：ref 的完整形状是 app/<id>/<arch>/<branch>，
      # 拿「app/<id>/ 之后的全部」会连 <arch> 一起当成分支名，flatpak 会回一句
      # Branch can't contain / 而失败。取最后一段才是分支。
      # 另外 bundle 里含的是本应用（以及同 repo 里的 debug runtime）；
      # org.gnome.Platform（连带底下的 freedesktop 基线）来自 Flathub，安装时按
      # metadata 里的 runtime 声明去取 —— 导出步骤已实测过 repo 里只有 app 与
      # debug runtime 两个 ref。
      - name: 导出单文件 bundle
        run: |
          set +e
          ostree --repo=flatpak-repo refs > repo-refs.txt 2>&1
          sed 's/^/::warning::repo ref: /' repo-refs.txt
          ref="$(grep '^app/com\.kxxnzstdsw\.sundays/' repo-refs.txt | head -n1)"
          if [ -z "$ref" ]; then
            echo "::error::repo 里没有 app/com.kxxnzstdsw.sundays 的 ref —— flatpak-builder 那步多半没真导出"
            echo "::error::repo 目录内容：$(ls -A flatpak-repo 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          branch="${ref##*/}"
          echo "::warning::ref=$ref，分支=$branch"
          flatpak build-bundle flatpak-repo \
            "sundays-flatpak-${{ matrix.flatpakArch }}.flatpak" \
            com.kxxnzstdsw.sundays "$branch" > bundle.log 2>&1
          rc=$?
          # 同样只取末尾 9 行，理由见「构建 Flatpak」那步的注释。
          tail -n 9 bundle.log | while IFS= read -r line; do echo "::error::$line"; done
          echo "::warning::build-bundle 退出码 = $rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ls -lh *.flatpak

      - uses: actions/upload-artifact@v7
        with:
          name: sundays-flatpak-${{ matrix.flatpakArch }}
          path: sundays-flatpak-${{ matrix.flatpakArch }}.flatpak
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------------
      # 失败原因转 annotation：GitHub 网页版会把大步骤日志整个截断，
      # 原始日志下载要仓库权限，结果就是 CI 一红没人看得到报错原文。
      # annotation 走 /check-runs/{id}/annotations，公开可读且不受步骤大小限制。
      - name: 失败原因（匿名可读）
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then
            echo "::error::没有 gradle-build.log；失败发生在 Gradle 之外（见上方步骤）"
            exit 0
          fi
          block="$(sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log)"
          if [ -z "$block" ]; then
            block="$(tail -n 20 gradle-build.log)"
          fi
          echo "$block"
          # 只捞真正的报错行。早先这里把 '^>' 也当关键词，于是 `> Task :xxx` 这种
          # 普通控制台进度行被当成报错刷了八条，annotation 全是噪音，
          # 反而把真正那句错误淹掉了 —— 排查时先被这些带偏。
          printf '%s\n' "$block" \
            | grep -vE '^> Task |^$' \
            | grep -E 'Caused by|Exception|error|Error|FAILURE|cannot|Could not|failed' \
            | tail -n 8 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done

  # ---------------------------------------------------------------------------
  # 把本工作流的产物挂到对应 tag 的 Release 上。
  #
  # 放在**构建工作流内部**而不是另起一个工作流：「产物在哪儿」与
  # 「产物去哪儿」写在同一份 YAML 里，加一条构建线只需顺手加一个文件路径。
  # 独立工作流则要重新推导出 run 列表、跨 run 下载、重整 —— 同一件事维护两套描述。
  #
  # 只在 tag 上跑：推 main 时挂上去等于把已发布的草稿改得面目全非。
  # 三个工作流的 release job 会并发创建同一个 Release，谁先谁算；
  # 万一撞上 422，单独重跑这一个 job 即可 —— 那时 Release 已存在，会走更新分支。
  release:
    name: 发布 Release 附件
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # job 级权限会**整体替换**工作流级的 contents: read，
      # 所以创建 Release 需要的写权限必须在这里显式写全。
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatpak 这条腿最省事：artifact 里就是那个 .flatpak，名字本来就是对的。
      - name: 整理附件
        shell: bash
        run: |
          set +e
          set -u
          mkdir -p out
          for f in artifacts/sundays-flatpak-*/*.flatpak; do
            [ -f "$f" ] || continue
            cp "$f" "out/"
          done
          echo "::warning::out: $(ls -A out 2>&1 | tr '\n' ' ' | cut -c1-60)"
          if [ ! -f out/sundays-flatpak-amd64.flatpak ] || [ ! -f out/sundays-flatpak-arm64.flatpak ]; then
            echo "::error::缺 flatpak 附件；artifacts 下有：$(ls -A artifacts 2>&1 | tr '\n' ' ' | cut -c1-60)"
            exit 1
          fi

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 自动发版不该替人按下发布键；确认内容后在 Release 页面点发布。
          # 已经存在的 Release（包括已发布的）这个参数是空操作。
          draft: true
