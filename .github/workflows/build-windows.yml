name: Windows 安装包

# 推 main / 打 tag / 手动触发都构建，x64 与 arm64 两条腿并行跑。
#
# 刻意**不在** pull_request 上跑：这个仓库的 UI 测试依赖内网 MySQL/PostgreSQL
# （192.168.1.5），PR 上必然红一片，起不到把关作用还把 CI 变成噪声。
# 真要在 PR 上验证，让它只跑到编译那一步，不要捎带测试。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: 打包 Windows ${{ matrix.arch }} 安装包
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # 关键：x64 是主力出货渠道，arm64 是后来补的、工具链明显更脆的一条腿
      # （JDK 得换厂商、WiX 得靠 x64 模拟跑、Gradle 在 Windows ARM 上禁用了富终端）。
      # 默认的 fail-fast 会让 ARM 一失败就把已经成功的 x64 一起取消掉，
      # 那等于「为了试新东西把老渠道也赔进去」，所以关掉。
      fail-fast: false
      matrix:
        # 矩阵键刻意全用驼峰、不带连字符 —— `matrix.java-distribution` 会被
        # Actions 表达式解析成减法（matrix.java - distribution）而静默失效，
        # 想省事就得写成 matrix['java-distribution']，两种写法都得记着，不如绕开。
        include:
          - arch: x64
            os: windows-latest
            jdk: temurin
            jdkArch: x64
            # PE header 里的 machine 字段：0x8664 = x64，0xAA64 = ARM64。
            # 留给「校验产物架构」那一步断言用。
            peMachine: '0x8664'
          - arch: arm64
            os: windows-11-arm
            # ⚠️ 这里**不能**用 temurin。Temurin 至今没有发布 Windows ARM64 的
            # JDK 25 —— 查 Adoptium 的 assets API：
            #   /v3/assets/latest/25/hotspot?architecture=aarch64&os=windows → []
            # 对照组：同一接口把 architecture 换成 x64 有 25.0.4.1+1，
            # 版本降到 21 也有 windows aarch64。也就是说卡的是「25 + Windows + ARM」
            # 这个组合，不是平台、也不是 API 用法。照抄 x64 那条腿的 temurin 的话，
            # setup-java 会在装 JDK 这一步直接失败，根本走不到打包。
            # Zulu 有 win_aarch64 的 25.0.4.1，正好和 x64 腿的 Temurin 25.0.4.1+1
            # 同一个 JDK 版本，也和本机 zulu 25.0.4.1 一致。
            jdk: zulu
            # architecture 默认值是 x64。ARM 腿必须显式给 aarch64
            # （arm64 是它的别名，会被规范化成 aarch64）。
            jdkArch: aarch64
            peMachine: '0xAA64'

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------------
      # 仓库里的 wrapper 指向腾讯云镜像，那是给国内开发机用的。
      # GitHub 托管的 runner 在境外，从那里拉一个 -all.zip（两百多 MB）既慢又不稳，
      # 失败时报的还是一句没有指向的「Could not download gradle-9.7.1-all.zip」。
      #
      # 只在 CI 里换回官方源，**不改仓库文件** —— 国内开发者照旧走镜像。
      # 换过之后 setup-gradle 的 wrapper-validation 还能顺带校验分发包
      # （wrapper.properties 里没有 distributionSha256Sum，本来是不验的）。
      #
      # 这一步必须排在 setup-gradle **之前**：那个 action 在被加载时就会看 URL。
      - name: Gradle 分发源换回官方
        shell: bash
        run: |
          sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 依赖仓库（settings.gradle.kts 里的 aliyun 镜像）**刻意保留**：
      # 阿里云镜像在境外 runner 上同样可达，只是比 mavenCentral 慢一些。
      # 摘掉它要改构建脚本，收益只是快几十秒，不值得让 CI 去动仓库文件。

      - uses: actions/setup-java@v6
        with:
          # 25 是本机实测能打出 MSI 的版本（zulu 25.0.4.1），Temurin 同为 25.0.4.1+1 LTS。
          # 仓库里的**编译目标**已经统一钉在 25（根 build.gradle.kts 的 jvmToolchain），
          # 这里仍然要钉 —— 它提供的是**这台 runner 上真正装着的那个 JDK**：
          #   · jlink / jpackage 要用它切运行时、打安装包；
          #   · 编译用的 toolchain 也是它 —— 版本对得上，foojay 就不必再下载一份。
          #
          # 两条腿的发行版不一样（x64 用 temurin、ARM64 用 zulu），但那不影响：
          # toolchain 只认版本号，不认厂商 —— 哪个厂商的 25 都算数。
          #
          # Gradle 从 9.2.0 起才正式支持在 Windows ARM64 上跑（本项目用 9.7.1，
          # 在官方兼容性矩阵的「Windows 11 / AMD64, AArch64」一栏里），
          # 代价是富终端被禁用、输出退化成纯文本 —— 只影响日志好不好看，无碍构建。
          java-version: '25'
          distribution: ${{ matrix.jdk }}
          architecture: ${{ matrix.jdkArch }}

      - uses: gradle/actions/setup-gradle@v6

      # packageMsi          → 安装包（WiX 由 Compose 插件自己下载解压，runner 无需预装）
      # createDistributable → 便携版目录，内含 sundays.exe
      #
      # 这一条流水线**对程序名无感知**，所以 packageName 从 com.langbiantianya.sundays
      # 改成 sundays 之后它一个字都不用动：
      #   · 架构自检是 `Get-ChildItem …/app -Directory` 遍历出来的，不认目录名；
      #   · 上传产物用的是 `msi/*.msi` 与 `app/` 通配；
      #   · Release job 里的名字来自 workflow 自己的 artifact 名（sundays-windows-<arch>-msi），
      #     与 packageName 无关。
      # 真要在意的话，下次改 packageName 时留意这三处仍是通配即可。
      # ARM 腿上这两步**没有任何额外配置**。整个链路是靠「跑在哪台机器上」自动切换的，
      # 仓库的构建脚本一个字都不用改：
      #   · Compose 插件读 System.getProperty("os.arch")，aarch64 → 目标 windows-arm64，
      #     于是 compose.desktop.currentOs 解析成 desktop-jvm-windows-arm64:1.11.1，
      #     它再带出 skiko-awt-runtime-windows-arm64:0.144.6（该坐标确实存在）。
      #   · WiX 是 wix311-binaries.zip，跟架构无关；里面的 candle/light 是 x64 程序，
      #     在 ARM64 Windows 上由系统的 x64 模拟层跑，不需要预装、也不需要设 WIX_PATH。
      #   · 其余带原生库的依赖都有 ARM64 版本（实测）：
      #     sqlite-jdbc 的 org/sqlite/native/Windows/aarch64/sqlitejdbc.dll、
      #     duckdb_jdbc 的 windows_arm64 分类、luajava 的 lua55arm64.dll / luajitarm64.dll。
      #
      # ⚠️ 便携版里的 exe **不是单文件**：jpackage 的 Windows 启动器依赖同级的
      # app/ 与 runtime/ 目录，单独把 exe 拷走跑不起来（会报缺 DLL）。
      # 所以上传整个目录，不 zip 也不挑文件 —— 免得有人下到一半才发现少东西。
      # 交给 upload-artifact 自己压缩，也避开了 Compress-Archive 在超长路径上的老毛病。
      #
      # pipefail 必须显式开：Gradle 的输出过了 tee 之后，管道最后一环的退出码
      # 成了 tee 的 0，不开 pipefail 的话**构建失败会被当成成功**，
      # 然后下一步 upload-artifact 因 if-no-files-found: error 才报一个驴唇不对马嘴的错。
      - name: 打包
        shell: bash
        run: |
          set -o pipefail
          ./gradlew.bat :desktopApp:packageMsi :desktopApp:createDistributable 2>&1 | tee gradle-build.log

      # 产物架构自检：矩阵里写了 arm64，不代表包里真是 arm64 的东西。
      # 这一步把「应该是」变成「验过」，同时挡住以后谁把坐标写死成 x64 的回归。
      #
      # 验两处，两处都必须对：
      #   1. jlink 出来的 runtime/bin/server/jvm.dll —— PE header 的 machine 字段
      #   2. app 目录里那份 skiko 原生 dll（skiko-windows-*.dll）
      # 只验第 1 处是不够的：jvm 对只说明 **JDK** 对，说明不了 Compose 有没有
      # 按 os.arch 选到对应的 skiko native 库 —— 而那才是这次 ARM 构建的核心风险点。
      # 第 2 处直接读那个 dll 的 machine 字段，比比对文件名可靠，
      # 也不必猜 ARM 端它到底叫什么。
      #
      # 故意放在上传**之前**：架构不对的包不该产出成可下载的产物。
      - name: 校验产物架构
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ matrix.peMachine }}'

          function Get-PeMachine([string]$path) {
            $b = [System.IO.File]::ReadAllBytes($path)
            # PE 签名在 0x3C 处存的是 e_lfanew，machine 紧跟在 PE\0\0 之后 4 字节
            $peOff = [BitConverter]::ToInt32($b, 0x3C)
            # 必须带上 0x 前缀，否则拿到的是 '8664'，跟 matrix 里的 '0x8664'
            # 比不相等 —— 架构明明对也会判失败（这个坑本地实跑才暴露出来）
            return '0x{0:X4}' -f [BitConverter]::ToUInt16($b, $peOff + 4)
          }

          $fail = @()
          $roots = Get-ChildItem 'desktopApp/build/compose/binaries/main/app' -Directory
          foreach ($r in $roots) {
            $jvm = Join-Path $r.FullName 'runtime/bin/server/jvm.dll'
            if (Test-Path $jvm) {
              $m = Get-PeMachine $jvm
              Write-Host "jvm.dll PE machine = 0x$m（期望 $expected）"
              if ($m -ne $expected) { $fail += "jvm.dll 架构不对：0x$m != $expected" }
            } else {
              $fail += "找不到 $jvm"
            }

            $dll = Get-ChildItem (Join-Path $r.FullName 'app') -Filter 'skiko-windows-*.dll' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($dll) {
              $m2 = Get-PeMachine $dll.FullName
              Write-Host "$($dll.Name) PE machine = 0x$m2"
              if ($m2 -ne $expected) { $fail += "skiko 原生库架构不对：$($dll.Name) 是 0x$m2 != $expected" }
            } else {
              $fail += 'app 目录里找不到 skiko-windows-*.dll'
            }
          }
          if ($roots.Count -eq 0) { $fail += 'app-image 目录是空的' }

          if ($fail.Count -gt 0) {
            $fail | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "架构自检通过：$expected"

      - uses: actions/upload-artifact@v7
        with:
          # x64 沿用原来的名字，老链接和已下到本地的东西不用改。
          name: sundays-windows-${{ matrix.arch }}-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: sundays-windows-${{ matrix.arch }}-portable
          path: desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 30

      # 打包失败时把 jpackage 的日志捞出来 —— 报错的最后几行只在文件里，
      # 控制台上往往只剩一句 exit code，没有这几行就只能靠猜。
      # artifact 名**必须带架构**：upload-artifact v4 起不允许同一 run 内重名，
      # 两条腿同时失败时都叫 packaging-logs 会撞车，反而把真正有用的日志丢掉。
      - name: 收集 jpackage 日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-logs-${{ matrix.arch }}
          path: desktopApp/build/compose/logs/
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------------------------------------------------
      # 这一步存在的唯一理由是**让失败可诊断**，两条腿都挂也无所谓。
      #
      # 问题的根源：GitHub 网页版会把大的步骤日志整个截断，显示成一句
      # 「This step has been truncated due to its large size」；想看原文只能下载
      # 原始日志，而那个接口要求仓库 admin 权限。结果就是 CI 一红，
      # 报错原文对没有 admin 的人不可见 —— 只能靠猜。
      #
      # 绕法：把报错用 `::error::` 工作流命令转成 **annotation**。
      # annotation 挂在 check-run 上，走 /check-runs/{id}/annotations 接口，
      # 那个接口公开可读，而且不受「步骤日志过大」的限制。
      # 代价是数量有上限（每步每级别 10 条、每 job 50 条），所以必须挑着发。
      #
      # 挑的是 Gradle 固定的报错骨架：
      #     * What went wrong:
      #     <真正的原因>
      #     * Try:
      # 只要 sed 出 `* What went wrong:` 到 `* Try:` 之间那一段。
      # 上一版直接取日志末尾 8 行，结果只捞到 `* Try:` 那段模板话，
      # 真正的原因全在它上面几十行 —— 白跑一轮。
      # -----------------------------------------------------------------------
      - name: 失败原因（匿名可读）
        if: failure()
        shell: bash
        run: |
          if [ ! -f gradle-build.log ]; then
            echo "::error::没有 gradle-build.log，打包步骤没跑到写日志那一步"
            exit 0
          fi
          # Gradle 报错骨架；捞不到就退回日志末尾 20 行（shell 自身失败等非 Gradle 错误）
          block="$(sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log)"
          if [ -z "$block" ]; then
            echo "（没找到 * What went wrong * 骨架，改用日志末尾 20 行）"
            block="$(tail -n 20 gradle-build.log)"
          fi
          echo "===== 失败详情 ====="
          echo "$block"
          echo "===== 关键行已转成 annotation ====="
          # `>` 开头的是 Gradle 给出的原因；Caused by / Exception 是异常链，
          # 三类一起收，取最后 8 条（annotation 上限 10 条，留点余量）
          printf '%s\n' "$block" \
            | grep -E '^(>|Caused by:)|[Ee]xception|[Ee]rror' \
            | tail -n 8 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done

  # 把本工作流的产物挂到对应 tag 的 Release 上。理由见 build-flatpak.yml 同名 job。
  release:
    name: 发布 Release 附件
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # job 级权限会整体替换工作流级的 contents: read，写权限必须在这里写全。
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 两种产物两种处理：
      #   msi      —— artifact 里就是那个 .msi，改个带架构与平台的名字
      #   portable —— artifact 本身是整棵 app-image **目录**，必须重打成 zip。
      #               直接把目录交给 Release 会变成几百个内部文件逐个上传。
      #
      # 用 python3 -m zipfile 而不是 zip 命令：zip 不是 runner 镜像的必备工具，
      # 而 python3 是这些工作流已经依赖的。ZipFile.write 会存 st_mode，
      # 便携版里的 .exe 可执行位不会在重打时丢掉。
      - name: 整理附件
        shell: bash
        run: |
          set +e
          set -u
          mkdir -p out
          for f in artifacts/sundays-windows-*-msi/*.msi; do
            [ -f "$f" ] || continue
            arch="$(basename "$(dirname "$f")" | sed -n 's/^sundays-windows-\(.*\)-msi$/\1/p')"
            [ -n "$arch" ] || continue
            cp "$f" "out/sundays-windows-$arch.msi"
          done
          for d in artifacts/sundays-windows-*-portable; do
            [ -d "$d" ] || continue
            arch="$(basename "$d" | sed -n 's/^sundays-windows-\(.*\)-portable$/\1/p')"
            [ -n "$arch" ] || continue
            # 传 `.` 而不是目录名：传目录名会把那层外壳也打进包里。
            # 输出写在 $d 之外，免得把自己打进自己。
            ( cd "$d" && python3 -m zipfile -c "$GITHUB_WORKSPACE/out/sundays-windows-$arch-portable.zip" . )
          done
          echo "::warning::out: $(ls -A out 2>&1 | tr '\n' ' ' | cut -c1-60)"
          for need in sundays-windows-x64.msi sundays-windows-arm64.msi \
                      sundays-windows-x64-portable.zip sundays-windows-arm64-portable.zip; do
            if [ ! -f "out/$need" ]; then
              echo "::error::缺 $need"
              exit 1
            fi
          done

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.msi
            out/*-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
