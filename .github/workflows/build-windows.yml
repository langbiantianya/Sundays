name: Windows 安装包

# 推 main / 打 tag / 手动触发都构建。
#
# 刻意**不在** pull_request 上跑：这个仓库的 UI 测试依赖内网 MySQL/PostgreSQL
# （192.168.1.5），PR 上必然红一片，起不到把关作用还把 CI 变成噪声。
# 真要在 PR 上验证，让它只跑到编译那一步，不要捎带测试。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: 打包 Windows x64 安装包
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------------
      # 仓库里的 wrapper 指向腾讯云镜像，那是给国内开发机用的。
      # GitHub 托管的 runner 在境外，从那里拉一个 -all.zip（两百多 MB）既慢又不稳，
      # 失败时报的还是一句没有指向的「Could not download gradle-9.7.1-all.zip」。
      #
      # 只在 CI 里换回官方源，**不改仓库文件** —— 国内开发者照旧走镜像。
      # 换过之后 setup-gradle 的 wrapper-validation 还能顺带校验分发包
      # （wrapper.properties 里没有 distributionSha256Sum，本来是不验的）。
      #
      # 这一步必须排在 setup-gradle **之前**：那个 action 在被加载时就会看 URL。
      - name: Gradle 分发源换回官方
        shell: bash
        run: |
          sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 依赖仓库（settings.gradle.kts 里的 aliyun 镜像）**刻意保留**：
      # 阿里云镜像在境外 runner 上同样可达，只是比 mavenCentral 慢一些。
      # 摘掉它要改构建脚本，收益只是快几十秒，不值得让 CI 去动仓库文件。

      - uses: actions/setup-java@v6
        with:
          # 25 是本机实测能打出 MSI 的版本（zulu 25.0.4.1，Temurin 同为 25.0.4.1+1 LTS）。
          # 仓库里**没有**任何 jvmToolchain 声明 —— 构建跟着跑它的 JDK 走，
          # 所以这里钉住的不只是「用什么编译」，还决定产物的字节码目标
          # 与 jlink 打包出来的运行时版本，两者必须与本地一致，否则测出来的包不是同一个包。
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # packageMsi          → 安装包（WiX 由 Compose 插件自己下载解压，runner 无需预装）
      # createDistributable → 便携版目录，内含 com.kxxnzstdsw.sundays.exe
      #
      # ⚠️ 便携版里的 exe **不是单文件**：jpackage 的 Windows 启动器依赖同级的
      # app/ 与 runtime/ 目录，单独把 exe 拷走跑不起来（会报缺 DLL）。
      # 所以上传整个目录，不 zip 也不挑文件 —— 免得有人下到一半才发现少东西。
      # 交给 upload-artifact 自己压缩，也避开了 Compress-Archive 在超长路径上的老毛病。
      - name: 打包
        run: .\gradlew.bat :desktopApp:packageMsi :desktopApp:createDistributable

      - uses: actions/upload-artifact@v7
        with:
          name: sundays-windows-x64-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: sundays-windows-x64-portable
          path: desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 30

      # 打包失败时把 jpackage 的日志捞出来 —— 报错的最后几行只在文件里，
      # 控制台上往往只剩一句 exit code，没有这几行就只能靠猜。
      - name: 收集 jpackage 日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-logs
          path: desktopApp/build/compose/logs/
          if-no-files-found: ignore
          retention-days: 7
