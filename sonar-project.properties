# SonarQube Server（自托管社区版）扫描配置。
#
# 官方文档原文：「Kotlin analysis is available in all editions of SonarQube Server
# and SonarQube Community Build.」所以社区版就能扫本项目，不需要商业版。
#
# 这份文件是**声明式**的：项目 key、分析范围、语言版本都在这里，
# 由 desktopApp/tools/sonar-local-scan.py 调用 sonar-scanner 时读取。
# 环境相关的三样（服务器地址、token、依赖 jar 列表）不进这个文件，
# 它们由该脚本从环境变量注入 —— 理由见下面「为什么不写在这里」。

# 项目标识。SonarQube Server 上第一次扫描时，如果这个 key 还不存在，
# 会自动以当前用户为 owner 建一个同名项目，无需先在网页上点。
sonar.projectKey=langbiantianya_Sundays
sonar.projectName=sundays

# 分析范围：整仓 + 排除。
#
# 刻意**不逐个模块列举** sonar.sources —— 那是 12 个模块的 12 行硬编码，
# 将来加一个模块忘了加这行，那个模块就静默地不进分析范围，
# 而且不报任何错。这里用 sonar.sources=. 让 SonarQube 扫整个仓库，
# 新模块自动纳入。
#
# 但 sonar.tests 必须列举：SonarQube 靠它区分「生产代码」与「测试代码」。
# 不区分的话，测试里的坏味道会被算成产品代码的问题，测试覆盖率的分母也会算错。
sonar.sources=.

# 12 个模块里有 10 个带测试源码（api / dialect-mysql / engine-protocol 没有）。
# shared 是 Kotlin Multiplatform，所以测试散在 commonTest 与 jvmTest 两处。
sonar.tests=desktopApp/src/test/kotlin,dialect-duckdb/src/test/kotlin,dialect-h2/src/test/kotlin,dialect-postgresql/src/test/kotlin,dialect-sqlite/src/test/kotlin,engine/src/test/kotlin,engine-grpc-client/src/test/kotlin,i18n/src/test/kotlin,shared/src/commonTest/kotlin,shared/src/jvmTest/kotlin

# ── 排除 ────────────────────────────────────────────────────────────
#   **/build/**            编译产物。engine-protocol 的 protoc 生成代码也在里面
#                          （那里有 2 万多行机器产物，扫了只会把真实问题淹掉）
#   **/.gradle/**          Gradle 工作目录
#   **/*.kts              Gradle 脚本：SonarQube 没有 Kotlin Script 解析器，
#                          收进来只会被当「无法解析的文件」计噪声
#   desktopApp/tools/**    本仓库自带的体检脚本，不是产品代码
#   **/*.md               Markdown
sonar.exclusions=**/build/**,**/.gradle/**,**/*.kts,desktopApp/tools/**,**/*.md,**/*.properties,**/*.yml,**/*.toml

# ── Kotlin 语言版本 ─────────────────────────────────────────────────
# 官方文档：Kotlin「2.4.0 完全支持，1.3~2.3 支持」。本项目用的是 Kotlin 2.4.20，
# 属性值按文档要求只写 X.Y 两位（不能写 2.4.20）。
# 不写这一项的话服务端会用自己的默认值，可能把 2.4 才有的语法判成解析失败。
sonar.kotlin.source.version=2.4

# 仓库全部是 UTF-8（见 desktopApp/tools/check-encoding.py 的体检项）。
# 不写这一项，SonarQube 会按平台默认编码读，Windows 上会把中文注释读成乱码，
# 进而报出一堆根本不存在的编码类问题。
sonar.sourceEncoding=UTF-8

# ── 刻意没有写的三项，以及为什么 ─────────────────────────────────────
#
# 1. sonar.host.url / sonar.login（token）
#    写死等于把本机地址和凭据提交进仓库。换台机器、换个端口都要改，
#    而且 token 进了 git 历史就等于泄漏。由 sonar-local-scan.py 从
#    SONAR_HOST_URL / SONAR_TOKEN 环境变量注入。
#
# 2. sonar.java.libraries
#    官方文档说：不用 SonarScanner for Gradle/Maven 时「强烈建议」提供依赖 jar，
#    否则类型解析不准，会冒出一堆 unresolved symbol 的假阳性。
#    但本仓库的依赖有 253 个 jar（507 个里一半是 -sources.jar），
#    硬写进配置既长又会随依赖升级过时。改由脚本从 Gradle 缓存里现算，
#    自动剔掉 -sources.jar / -javadoc.jar —— 那两个喂给分析器只会帮倒忙。
#
# 3. sonar.coverageReportPaths
#    本项目没有接 JaCoCo（Kotlin 的覆盖率要靠 ktlint 之外另配工具），
#    写一个指向不存在文件的路径会让 SonarQube 每次扫描都报错。
#    等真的接了覆盖率再补这一行。
